<style>

  .act{display:flex;flex-direction:column;gap:8px;margin:4px 0 6px}
  .btn{width:100%;padding:14px;border-radius:14px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}

  .fld{margin:0 0 12px}

  .gate p{font-size:14.5px;color:var(--ink-2);margin:0 0 14px}
  .gate code{background:var(--o-050);border:1px solid var(--o-100);color:var(--o-700);padding:2px 6px;border-radius:6px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .steps{list-style:none;margin:16px 0 0;padding:0;font-size:13.5px;color:var(--ink-2)}
  .steps li{display:flex;gap:10px;padding:5px 0;align-items:flex-start}
  .steps b{flex:0 0 auto;width:19px;height:19px;border-radius:6px;background:var(--o-100);color:var(--o-700);font-size:11px;display:grid;place-items:center;font-weight:800;margin-top:1px}
  .or{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:11px;font-weight:750;letter-spacing:1px;margin:16px 0}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

  .hint{padding:0 20px;font-size:12.5px;color:var(--ink-3);text-align:center;line-height:1.6}
  .skel{padding:70px 0;text-align:center;color:var(--ink-3);font-size:13.5px;font-weight:600}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:90;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:650;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 8px 24px rgba(42,28,20,.28);max-width:88vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .status{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);padding:8px 16px 0}
  .status i{width:6px;height:6px;border-radius:50%;background:var(--green);flex:0 0 auto}
  .status i.wait{background:var(--o-500)}
  .status i.bad{background:#DC2626}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand">

      <button class="me-btn" id="meBtn" aria-label="You and your teams">

      </button>

  <div id="body"><div class="skel">Starting up…</div></div>

</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script type="module">
/* ═══════════════════════════════════════════════════════════
   ①  PASTE YOUR FIREBASE CONFIG HERE  (same six values as before)
   ═══════════════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey:            "AIzaSyAuD0vD6OoXH7fK-zhyDsSNvwU2jb_GaRU",
  authDomain:        "team-leaves-270f6.firebaseapp.com",
  projectId:         "team-leaves-270f6",
  storageBucket:     "team-leaves-270f6.firebasestorage.app",
  messagingSenderId: "241879513784",
  appId:             "1:241879513784:web:013ceeecfd42d469aa524d"
};

/* ═══════════════════════════════════════════════════════════ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, onSnapshot, setDoc, runTransaction, deleteField
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CONFIGURED = !String(firebaseConfig.apiKey).startsWith("PASTE_");
let auth = null, db = null;
if(CONFIGURED){
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = initializeFirestore(app, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
  });
}

/* ═══════════════════════════════════════════════════════════
   ②  State
   ═══════════════════════════════════════════════════════════ */
let allTeams = [];     // [{id, name, size}]  EVERY team — this is the picker list
let known = [];        // [{id, name}]  teams this person has joined on this phone
let tid = null;        // current team id
let teamDoc = null;    // { name, leadId, members:[{id,name,color}] }
let yearData = {};     // { "2026": { memberId: { dateKey: type } } }
let leaves = {};       // flattened { memberId: { dateKey: type } }
let meId = null;       // which member I am, on THIS device, for THIS team
let view = "calendar";
let filter = "all";
let cursor = startOfMonth(new Date());
let phase = "boot";    // boot | pick | app
let subs = { all:null, team:null, years:{} };
let net = { online: navigator.onLine, cached:false, pending:0, error:null };
let openSheet_ = null;
let rangeMode = false;      // "Select range" toggle
let anchorKey = null;       // first date of a range being built
let hoverKey = null;        // date currently under the finger
let dragging = false;

const COLORS = ["#F37E20","#8A1538","#B45309","#0F766E","#9A3412","#1D4ED8",
                "#166534","#BE185D","#6D28D9","#A16207","#7C2D12","#0E7490"];
const DOW = ["M","T","W","T","F","S","S"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ═══════════════════════════════════════════════════════════
   ③  Helpers  (function declarations — hoisted, so `cursor` above works)
   ═══════════════════════════════════════════════════════════ */
function pad(n){ return n < 10 ? "0"+n : ""+n; }
function key(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parse(k){ const p = k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function addMonths(d,n){ return new Date(d.getFullYear(), d.getMonth()+n, 1); }
function daysInMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function todayKey(){ return key(new Date()); }
function isWeekend(d){ const g = d.getDay(); return g === 0 || g === 6; }
function mondayIndex(d){ return (d.getDay()+6)%7; }
function nextDayKey(k){ const d = parse(k); d.setDate(d.getDate()+1); return key(d); }
function datesBetween(a,b){
  if(a > b){ const t = a; a = b; b = t; }
  const out = []; let k = a;
  for(let guard = 0; guard < 800; guard++){ out.push(k); if(k === b) break; k = nextDayKey(k); }
  return out;
}
function longDate(k){
  const d = parse(k);
  const wd = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()];
  return wd+", "+d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear();
}
function esc(s){ return String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function initials(name){
  const p = String(name||"").trim().split(/\s+/).filter(Boolean);
  if(!p.length) return "?";
  if(p.length === 1) return p[0].slice(0,2).toUpperCase();
  return (p[0][0]+p[p.length-1][0]).toUpperCase();
}
function roster(){ return teamDoc && Array.isArray(teamDoc.members) ? teamDoc.members : []; }
function member(id){ return roster().find(m => m.id === id) || null; }
function me(){ return member(meId); }
function iAmLead(){ return !!(teamDoc && meId && teamDoc.leadId === meId); }
function leadName(){ const m = member(teamDoc ? teamDoc.leadId : null); return m ? m.name : "nobody yet"; }
function avatar(m, cls){
  return `<span class="av ${cls||""}" style="background:${m.color||"#F37E20"}">${esc(initials(m.name))}</span>`;
}
function daysOf(id){ return leaves[id] || {}; }
function outOn(k){
  const list = [];
  for(const m of roster()){
    const t = daysOf(m.id)[k];
    if(t) list.push({ m, type:t });
  }
  return list;
}
function upcoming(id){
  const t = todayKey();
  return Object.keys(daysOf(id)).sort().filter(k => k >= t);
}
/* Random team id. NOTE: this is just a name, not a secret. Everyone can see
   the full list of teams — separation here is in the app, not on the server. */
function newTeamId(){
  const bytes = new Uint8Array(8);
  (crypto || window.crypto).getRandomValues(bytes);
  return "t"+Array.from(bytes).map(b => b.toString(36).padStart(2,"0")).join("").slice(0,12);
}
function newMemberId(){
  return "m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
}
function appLink(){
  return location.origin + location.pathname;
}

/* ═══════════════════════════════════════════════════════════
   ④  Local memory  (which teams this device knows, and who I am in each)
   ═══════════════════════════════════════════════════════════ */
function lsGet(k){ try { return localStorage.getItem("tl:"+k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem("tl:"+k, v); } catch(e){} }
function loadKnown(){
  try { const j = JSON.parse(lsGet("known") || "[]"); known = Array.isArray(j) ? j : []; }
  catch(e){ known = []; }
}
function saveKnown(){ lsSet("known", JSON.stringify(known)); }
function rememberTeam(id, name){
  const at = known.findIndex(t => t.id === id);
  if(at === -1) known.push({ id, name: name || "Team" });
  else if(name) known[at].name = name;
  saveKnown();
}
function forgetTeam(id){
  known = known.filter(t => t.id !== id);
  saveKnown();
}
function joinTeam(id){
  const t = allTeams.find(x => x.id === id);
  rememberTeam(id, t ? t.name : "Team");
  lsSet("me:"+id, "");
  closeSheet();
  openTeam(id);
}

/* ═══════════════════════════════════════════════════════════
   ⑤  Listeners
   ═══════════════════════════════════════════════════════════ */
function watchAllTeams(){
  if(subs.all) return;
  subs.all = onSnapshot(collection(db, "teams"),
    snap => {
      allTeams = snap.docs.map(d => {
        const v = d.data() || {};
        return { id:d.id, name:v.name || "Untitled team",
                 size:Array.isArray(v.members) ? v.members.length : 0 };
      }).sort((a,b) => String(a.name).localeCompare(String(b.name)));
      // keep locally-stored names fresh if a lead renames a team
      let changed = false;
      for(const k of known){
        const hit = allTeams.find(t => t.id === k.id);
        if(hit && hit.name !== k.name){ k.name = hit.name; changed = true; }
      }
      if(changed) saveKnown();
      if(phase === "pick") render();
    },
    err => { net.error = err.code || "unavailable"; render(); }
  );
}

function stopAll(){
  if(subs.team){ subs.team(); subs.team = null; }
  for(const y of Object.keys(subs.years)){ subs.years[y](); }
  subs.years = {};
}

function openTeam(id){
  stopAll();
  tid = id;
  teamDoc = null; yearData = {}; leaves = {}; filter = "all";
  meId = lsGet("me:"+id);
  lsSet("lastTeam", id);
  phase = "boot"; render();

  subs.team = onSnapshot(doc(db, "teams", id),
    snap => {
      if(tid !== id) return;
      if(!snap.exists()){
        net.error = "missing";
        phase = "pick";
        forgetTeam(id);
        render();
        return;
      }
      teamDoc = snap.data();
      net.cached = snap.metadata.fromCache;
      net.error = null;
      rememberTeam(id, teamDoc.name);
      if(meId && !member(meId)){ meId = null; lsSet("me:"+id, ""); }
      phase = "app";
      const y = new Date().getFullYear();
      watchYear(y); watchYear(y+1);
      render();
    },
    err => {
      net.error = err.code || "unavailable";
      phase = teamDoc ? "app" : "pick";
      render();
    }
  );
}

function watchYear(y){
  y = String(y);
  if(subs.years[y]) return;
  const forTeam = tid;
  subs.years[y] = onSnapshot(doc(db, "teams", forTeam, "years", y),
    snap => {
      if(tid !== forTeam) return;
      yearData[y] = (snap.exists() && snap.data().days) ? snap.data().days : {};
      net.cached = snap.metadata.fromCache;
      net.pending = snap.metadata.hasPendingWrites ? 1 : 0;
      rebuild(); render();
    },
    err => { net.error = err.code || "unavailable"; render(); }
  );
}

function rebuild(){
  leaves = {};
  for(const y of Object.keys(yearData)){
    const byMember = yearData[y] || {};
    for(const mid of Object.keys(byMember))
      leaves[mid] = Object.assign(leaves[mid] || {}, byMember[mid] || {});
  }
}

/* ═══════════════════════════════════════════════════════════
   ⑥  Writes
   ═══════════════════════════════════════════════════════════ */
async function createTeam(name, myName){
  name = String(name||"").trim(); myName = String(myName||"").trim();
  if(!name){ toast("Give the team a name"); return null; }
  if(!myName){ toast("Enter your own name"); return null; }
  const id = newTeamId(), mid = newMemberId();
  try {
    await setDoc(doc(db, "teams", id), {
      name,
      leadId: mid,
      members: [{ id:mid, name:myName, color:COLORS[0] }],
      createdAt: new Date().toISOString()
    });
    rememberTeam(id, name);
    lsSet("me:"+id, mid);
    openTeam(id);
    return id;
  } catch(e){ toast("Couldn't create the team. Are you online?"); return null; }
}

async function addMember(name){
  name = String(name||"").trim().replace(/\s+/g," ");
  if(!name){ toast("Enter a name"); return null; }
  if(roster().some(m => m.name.toLowerCase() === name.toLowerCase())){
    toast(esc(name)+" is already on this team"); return null;
  }
  const mid = newMemberId();
  try {
    await runTransaction(db, async tx => {
      const ref = doc(db, "teams", tid);
      const snap = await tx.get(ref);
      if(!snap.exists()) throw new Error("gone");
      const cur = Array.isArray(snap.data().members) ? snap.data().members : [];
      if(cur.some(m => m.name.toLowerCase() === name.toLowerCase())) return;
      tx.set(ref, { members: cur.concat([{ id:mid, name, color:COLORS[cur.length % COLORS.length] }]) },
             { merge:true });
    });
    return mid;
  } catch(e){ toast("Adding people needs internet."); return null; }
}

async function renameMember(id, name){
  if(!iAmLead()){ toast("Only the team lead can edit names"); return false; }
  name = String(name||"").trim().replace(/\s+/g," ");
  if(!name){ toast("Enter a name"); return false; }
  const existing = member(id);
  if(!existing) return false;
  if(name === existing.name) return true;
  if(roster().some(m => m.id !== id && m.name.toLowerCase() === name.toLowerCase())){
    toast("Someone else on this team already has that name"); return false;
  }
  try {
    await runTransaction(db, async tx => {
      const ref = doc(db, "teams", tid);
      const snap = await tx.get(ref);
      if(!snap.exists()) throw new Error("gone");
      const cur = Array.isArray(snap.data().members) ? snap.data().members : [];
      tx.set(ref, { members: cur.map(m => m.id === id ? Object.assign({}, m, { name }) : m) },
             { merge:true });
    });
    toast("Name updated");
    return true;
  } catch(e){ toast("Editing names needs internet."); return false; }
}

async function removeMember(id){
  if(id === teamDoc.leadId){ toast("Hand over the lead role first"); return; }
  try {
    await runTransaction(db, async tx => {
      const ref = doc(db, "teams", tid);
      const snap = await tx.get(ref);
      const cur = Array.isArray(snap.data().members) ? snap.data().members : [];
      tx.set(ref, { members: cur.filter(m => m.id !== id) }, { merge:true });
    });
    for(const y of Object.keys(subs.years))
      await setDoc(doc(db, "teams", tid, "years", y), { days: { [id]: deleteField() } }, { merge:true });
    if(meId === id){ meId = null; lsSet("me:"+tid, ""); }
    if(filter === id) filter = "all";
    toast("Removed");
  } catch(e){ toast("Removing people needs internet."); }
}

async function renameTeam(name){
  name = String(name||"").trim().replace(/\s+/g," ");
  if(!name){ toast("Give the team a name"); return; }
  if(name.length > 79){ toast("That name is too long"); return; }
  if(name === teamDoc.name) return;
  if(!iAmLead()){ toast("Only the team lead can rename the team"); return; }
  try {
    await setDoc(doc(db, "teams", tid), { name }, { merge:true });
    rememberTeam(tid, name);
    toast("Renamed to "+esc(name));
  } catch(e){ toast("Couldn't rename. Needs internet."); }
}

async function makeLead(id){
  const m = member(id);
  if(!m) return;
  if(!confirm("Make "+m.name+" the lead of "+teamDoc.name+"?\n\nYou'll stay on the team but the add/remove controls move to them.")) return;
  try {
    await setDoc(doc(db, "teams", tid), { leadId:id }, { merge:true });
    toast(m.name.split(" ")[0]+" is now the team lead");
    refreshSheet();
  } catch(e){ toast("Couldn't transfer. Needs internet."); }
}

/* Every team this phone has joined AND picked a name in. A person has a
   different member id in each team, so mirroring means writing the same dates
   under each of those ids. */
function myTargets(){
  const out = [], missing = [];
  for(const t of known){
    const mid = lsGet("me:"+t.id);
    if(mid) out.push({ tid:t.id, mid, name:t.name });
    else missing.push(t.name);
  }
  return { targets:out, missing };
}

/* Mark or unmark any number of dates, across every team at once. */
async function writeLeaves(keys, on){
  keys = keys.filter(k => k >= todayKey());
  if(!keys.length){ toast("Past dates can't be changed"); return; }
  if(!meId){ openWhoami(); return; }

  const { targets, missing } = myTargets();
  if(!targets.length){ openWhoami(); return; }

  // group by calendar year so each year document is written once
  const byYear = {};
  for(const k of keys){
    const y = k.slice(0,4);
    if(!byYear[y]) byYear[y] = [];
    byYear[y].push(k);
  }

  // optimistic update for the team on screen, so the tap feels instant
  for(const y of Object.keys(byYear)){
    watchYear(y);
    yearData[y] = yearData[y] || {};
    yearData[y][meId] = yearData[y][meId] || {};
    for(const k of byYear[y]){
      if(on) yearData[y][meId][k] = "full"; else delete yearData[y][meId][k];
    }
  }
  rebuild(); render();

  try {
    for(const tg of targets){
      for(const y of Object.keys(byYear)){
        const days = {};
        for(const k of byYear[y]) days[k] = on ? "full" : deleteField();
        await setDoc(doc(db, "teams", tg.tid, "years", y),
          { days: { [tg.mid]: days } }, { merge:true });
      }
    }
    const n = keys.length;
    const what = n === 1 ? "Leave" : n+" days";
    const where = targets.length > 1 ? " in all "+targets.length+" of your teams" : "";
    toast(what + (on ? " marked" : " removed") + where);
    if(missing.length)
      setTimeout(() => toast("Pick your name in "+esc(missing[0])+" to mirror leaves there"), 2700);
  } catch(e){ toast("Couldn't save — check your connection"); }
}

function exportJSON(){
  const data = { exported:new Date().toISOString(), team:teamDoc.name,
                 lead:leadName(), members:roster(), leaves };
  const blob = new Blob([JSON.stringify(data,null,2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "leaves-"+String(teamDoc.name).replace(/\W+/g,"-").toLowerCase()+"-"+todayKey()+".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Backup downloaded");
}

async function copy(text, label){
  try { await navigator.clipboard.writeText(text); toast((label||"Copied")); }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(label||"Copied"); }
    catch(e2){ toast("Copy failed — select the text manually"); }
    document.body.removeChild(ta);
  }
}

  $body.innerHTML = teamsBarHTML() + segHTML() + chipsHTML()
    + (view === "calendar" ? calendarHTML() : peopleHTML()) + footHTML();

function renderTop(){
  document.getElementById("hTitle").textContent = teamDoc ? teamDoc.name : "Team Leaves";
  document.getElementById("hTick").textContent = teamDoc
    ? roster().length + (roster().length === 1 ? " person" : " people") + (iAmLead() ? " · you lead" : "")
    : "";

    `<span class="av" id="meAv" style="background:${m ? m.color : "rgba(255,255,255,.3)"}">${m ? esc(initials(m.name)) : "+"}</span>`;

  if(!roster().length){ line.innerHTML = "Add your team members to get started."; return; }

  line.innerHTML = out.length
    ? `<b>${out.length}${out.length === 1 ? " person" : " people"} out today</b><span class="dotsep"></span>`

function renderStatus(){
  const s = document.getElementById("statusNote");
  if(net.error === "missing") s.innerHTML = `<i class="bad"></i> That team no longer exists`;
  else if(net.error === "permission-denied") s.innerHTML = `<i class="bad"></i> Access denied — check your security rules`;
  else if(net.error) s.innerHTML = `<i class="bad"></i> Can't reach the server — showing saved data`;
  else if(!net.online) s.innerHTML = `<i class="wait"></i> Offline — changes will sync automatically`;
  else if(net.pending) s.innerHTML = `<i class="wait"></i> Saving…`;
  else if(net.cached) s.innerHTML = `<i class="wait"></i> Reconnecting — showing saved data`;
  else if(phase === "app") s.innerHTML = `<i></i> Synced with your team`;
  else s.innerHTML = "";
}

function calendarHTML(){
  const y = cursor.getFullYear(), mo = cursor.getMonth();
  const lead = mondayIndex(new Date(y, mo, 1));
  const total = daysInMonth(cursor), tk = todayKey();
  const solo = filter !== "all" ? filter : null;
  const mine = meId ? daysOf(meId) : {};

  let h = `<div class="card">
    <div class="cal-head"><h2>${MONTHS[mo]} <em>${y}</em></h2>
    <div class="nav"><button data-act="mo" data-d="-1" aria-label="Previous month">‹</button>
    <button data-act="mo" data-d="0" aria-label="This month">•</button>
    <button data-act="mo" data-d="1" aria-label="Next month">›</button></div></div>`;

  h += rangeMode
    ? `<div class="rangebar on"><span>${anchorKey
        ? "Now tap or drag to the last day"
        : "Tap the first day, then drag or tap the last"}</span>
       <button data-act="range-off">Done</button></div>`
    : `<div class="rangebar"><span>Tap a date to mark your leave</span>
       <button data-act="range-on">Select range</button></div>`;

  h += `<div class="dow">${DOW.map(d => `<span>${d}</span>`).join("")}</div>
    <div class="grid${rangeMode ? " picking" : ""}" id="calGrid">`;

  for(let i=0;i<lead;i++) h += `<div class="day pad"></div>`;
  for(let d=1; d<=total; d++){
    const date = new Date(y, mo, d), k = key(date);
    const cls = ["day"];
    if(isWeekend(date)) cls.push("weekend");
    if(k === tk) cls.push("today");
    if(k < tk) cls.push("past");
    if(rangeMode && anchorKey && hoverKey && k >= (anchorKey < hoverKey ? anchorKey : hoverKey)
       && k <= (anchorKey < hoverKey ? hoverKey : anchorKey)) cls.push("sel");
    else if(rangeMode && anchorKey === k) cls.push("sel");
    let inner = `<span class="n">${d}</span>`;
    if(solo){
      if(daysOf(solo)[k]) cls.push("solo-on");
    } else {
      const out = outOn(k);
      if(out.length) inner += `<span class="stack">${out.slice(0,3).map(o => avatar(o.m)).join("")}`
        + (out.length > 3 ? `<span class="more">+${out.length-3}</span>` : "")+`</span>`;
      if(mine[k]) inner += `<span class="mine"></span>`;
    }
    h += `<button class="${cls.join(" ")}" data-act="day" data-k="${k}">${inner}</button>`;
  }
  h += `</div></div><div class="legend">` + (solo
    ? `<span><i style="background:var(--o-500)"></i>${esc((member(solo)||{name:"?"}).name.split(" ")[0])} on leave</span>`
    : `<span><i style="background:var(--o-500)"></i>Initials = who's out</span>`
      + (meId ? `<span><i style="background:var(--maroon)"></i>Bar = your own leave</span>` : "")) 
    + `<span>Press and hold a date to see who's out</span></div>`;
  return h;
}

/* Group a person's upcoming leaves into consecutive runs, then describe each
   one the way someone would say it out loud: "Thu 20 – Fri 21 Aug, 2 days". */
function upcomingList(id){
  const ks = upcoming(id), days = daysOf(id);
  const groups = []; let cur = null;
  for(const k of ks){
    const t = days[k];
    if(cur && cur.type === t && nextDayKey(cur.end) === k){ cur.end = k; continue; }
    cur = { start:k, end:k, type:t }; groups.push(cur);
  }
  const thisYear = new Date().getFullYear();
  const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return groups.map(g => {
    const a = parse(g.start), b = parse(g.end);
    const yr = d => d.getFullYear() === thisYear ? "" : " " + d.getFullYear();
    let label;
    if(g.start === g.end){
      label = WD[a.getDay()]+" "+a.getDate()+" "+MON[a.getMonth()]+yr(a);
    } else if(a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear()){
      label = WD[a.getDay()]+" "+a.getDate()+" – "+WD[b.getDay()]+" "+b.getDate()+" "+MON[b.getMonth()]+yr(b);
    } else {
      label = WD[a.getDay()]+" "+a.getDate()+" "+MON[a.getMonth()]+yr(a)
            +" – "+WD[b.getDay()]+" "+b.getDate()+" "+MON[b.getMonth()]+yr(b);
    }
    return { label, today: g.start === todayKey() };
  });
}

const $sheet = document.getElementById("sheet"), $scrim = document.getElementById("scrim");
function showSheet(html){
  $sheet.innerHTML = `<div class="handle"></div>`+html;
  $sheet.classList.add("on"); $scrim.classList.add("on");

function closeSheet(){ openSheet_ = null; $sheet.classList.remove("on"); $scrim.classList.remove("on"); }

function refreshSheet(){
  if(!openSheet_) return;
  const t = openSheet_.type;
  if(t === "day"){ showSheet(daySheetHTML(openSheet_.k)); return; }
  if(t === "share"){ showSheet(shareSheetHTML()); return; }
  if(t === "newteam" || t === "editmember") return;   // never clobber a form mid-typing
  if(t === "manage"){
    const keep = {};
    for(const id of ["amName","tmRename"]){
      const el = document.getElementById(id);
      if(el) keep[id] = { v:el.value, focused:document.activeElement === el };
    }
    showSheet(manageSheetHTML());
    for(const id of Object.keys(keep)){
      const el = document.getElementById(id);
      if(el){ el.value = keep[id].v; if(keep[id].focused) el.focus(); }
    }
  }
}

function daySheetHTML(k){
  const out = outOn(k);
  const mine = meId ? daysOf(meId)[k] : null;
  let h = `<h3>${longDate(k)}</h3>
    <div class="sub">${out.length ? out.length+(out.length===1?" person":" people")+" out" : "Nobody on leave"} · ${esc(teamDoc.name)}</div>`;
  h += out.length
    ? `<ul class="out-list">${out.map(o => `<li>${avatar(o.m)}<span>${esc(o.m.name)}</span></li>`).join("")}</ul>`
    : `<p class="empty-out">Full team available.</p>`;
  h += `<div class="act">`;
  if(meId && k >= todayKey())
    h += `<button class="btn ${mine ? "danger" : "primary"}" data-act="toggle" data-k="${k}">${
      mine ? "Remove my leave" : "Mark my leave"}</button>`;
  h += `<button class="btn flat" data-act="close">Close</button></div>`;
  return h;
}

function manageSheetHTML(){
  const lead = iAmLead();
  let h = `<h3>${esc(teamDoc.name)}</h3>
    <div class="sub">${roster().length} ${roster().length===1?"person":"people"} · lead is ${esc(leadName())}</div>`;

  if(lead){
    h += `<div class="fld"><label>Team name</label>
      <input id="tmRename" value="${esc(teamDoc.name)}" autocomplete="off"></div>
      <div class="act" style="margin-bottom:18px"><button class="btn flat" data-act="tm-rename">Save name</button></div>`;
    h += `<div class="fld"><label>Add someone</label>
      <input id="amName" placeholder="Their full name" autocomplete="off"></div>
      <div class="act" style="margin-bottom:14px"><button class="btn primary" data-act="am-add">Add to ${esc(teamDoc.name)}</button></div>`;
  }

  h += `<ul class="mlist">`;
  for(const m of roster()){
    const isLead = m.id === teamDoc.leadId;
    h += `<li>${avatar(m)}<div class="who"><b>${esc(m.name)}</b>${
      m.id===meId ? `<span>This is you on this phone</span>` : ""}</div>`;
    if(isLead) h += `<span class="lead">LEAD</span>`;
    if(m.id !== meId && !isLead) h += `<button class="pick" data-act="setme" data-id="${m.id}">I'm ${esc(m.name.split(" ")[0])}</button>`;
    if(lead) h += `<button class="mini" data-act="editm" data-id="${m.id}" title="Edit name">✎</button>`;
    if(lead && !isLead) h += `<button class="mini" data-act="makelead" data-id="${m.id}" title="Make lead">★</button>
                              <button class="mini" data-act="rm" data-id="${m.id}" title="Remove">✕</button>`;
    if(isLead && m.id !== meId) h += `<button class="pick" data-act="setme" data-id="${m.id}">I'm ${esc(m.name.split(" ")[0])}</button>`;
    h += `</li>`;
  }
  h += `</ul>`;
  if(!lead) h += `<p style="font-size:12.5px;color:var(--ink-3);margin:12px 0 0">Only ${esc(leadName().split(" ")[0])} can add or remove people.</p>`;
  h += `<div class="act" style="margin-top:16px">
    <button class="btn flat" data-act="share">Share the app</button>
    <button class="btn flat" data-act="export">Download a backup</button>
    <button class="btn flat" data-act="close">Done</button></div>`;
  return h;
}

function shareSheetHTML(){
  const link = appLink();
  const msg = `Team leave tracker:\n${link}\n\nTap the link, then install it — Android: \u22EE menu \u2192 Install app. iPhone: open in Safari \u2192 Share \u2192 Add to Home Screen.\n\nOpen it from the new icon, pick your team, then tap your own name. After that just tap dates to mark your leaves.`;
  return `<h3>Share the app</h3>
    <div class="sub">Everyone uses this link and picks their team on first open</div>
    <div class="linkbox">${esc(link)}</div>
    <div class="act">
      <button class="btn primary" data-act="copylink">Copy link</button>
      <button class="btn ghost" data-act="copymsg">Copy a WhatsApp message</button>
      <button class="btn flat" data-act="close">Done</button></div>
    <textarea id="shareMsg" style="position:absolute;left:-9999px" readonly>${esc(msg)}</textarea>`;
}

function editMemberSheetHTML(id){
  const m = member(id);
  if(!m) return `<h3>Not found</h3><div class="act"><button class="btn flat" data-act="manage">Back</button></div>`;
  return `<h3>Edit name</h3>
    <div class="sub">${esc(teamDoc.name)}</div>
    <div class="fld"><label>Full name</label>
      <input id="emName" value="${esc(m.name)}" autocomplete="off"></div>
    <p style="font-size:12.5px;color:var(--ink-3);margin:0 0 8px">
      Fixing a spelling won't touch their marked leaves.</p>
    <div class="act">
      <button class="btn primary" data-act="em-save" data-id="${id}">Save</button>
      <button class="btn flat" data-act="manage">Cancel</button></div>`;
}

function newTeamSheetHTML(){
  return `<h3>Create a team</h3>
    <div class="sub">You'll be its lead</div>
    <div class="fld"><label>Team name</label>
      <input id="ntName" placeholder="e.g. Brand Partnerships" autocomplete="off"></div>
    <div class="fld"><label>Your name, as teammates should see it</label>
      <input id="ntMe" placeholder="e.g. Ankit Sharma" autocomplete="off"></div>
    <div class="act"><button class="btn primary" data-act="nt-create">Create team</button>
      <button class="btn flat" data-act="close">Cancel</button></div>`;
}

function whoamiSheetHTML(){
  let h = `<h3>Which one are you?</h3>
    <div class="sub">This phone will remember. You can only mark your own leaves.</div><ul class="mlist">`;
  for(const m of roster())
    h += `<li>${avatar(m)}<div class="who"><b>${esc(m.name)}</b></div>${
      m.id===meId ? `<span class="lead">YOU</span>` : `<button class="pick" data-act="setme" data-id="${m.id}">This is me</button>`}</li>`;
  h += `</ul><div class="act" style="margin-top:16px">
    <button class="btn flat" data-act="close">Close</button></div>`;
  return h;
}

function accountSheetHTML(){
  const m = me();
  let h = `<h3>${m ? esc(m.name) : "Pick your name"}</h3>
    <div class="sub">${teamDoc ? esc(teamDoc.name) : ""}${iAmLead() ? " · you're the lead" : ""}</div>
    <div class="act">
      <button class="btn ${m ? "flat" : "primary"}" data-act="whoami">${m ? "I'm someone else" : "Pick your name"}</button>
      <button class="btn flat" data-act="manage">${iAmLead() ? "Manage team" : "Team members"}</button>
      <button class="btn flat" data-act="pick">Join another team</button>
      <button class="btn flat" data-act="share">Share the app</button>
      <button class="btn flat" data-act="newteam">Create another team</button>`;
  h += `<button class="btn danger" data-act="forget">Leave ${esc(teamDoc.name)} on this phone</button>`;
  h += `<button class="btn flat" data-act="close">Close</button></div>
    <p style="font-size:12px;color:var(--ink-3);margin:12px 0 0;line-height:1.6">
      Removing a team from this phone only hides it here — the team and its leaves stay for everyone else.</p>`;
  return h;
}

function openWhoami(){
  openSheet_ = { type:"whoami" };
  showSheet(whoamiSheetHTML());
}

let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.innerHTML = msg; el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 2600);
}

/* ═══════════════════════════════════════════════════════════
   ⑨  Events
   ═══════════════════════════════════════════════════════════ */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.getAttribute("data-act");

  if(act === "view"){ view = el.getAttribute("data-v"); render(); return; }
  if(act === "filter"){ filter = el.getAttribute("data-id"); render(); return; }
  if(act === "team"){
    const id = el.getAttribute("data-id");
    if(id === tid && phase === "app") return;
    closeSheet(); openTeam(id); return;
  }
  if(act === "mo"){
    const d = +el.getAttribute("data-d");
    cursor = d === 0 ? startOfMonth(new Date()) : addMonths(cursor, d);
    render(); return;
  }

  if(act === "toggle"){
    const k = el.getAttribute("data-k");
    closeSheet();
    await writeLeaves([k], !(meId && daysOf(meId)[k]));
    return;
  }
  if(act === "range-on"){ rangeMode = true; anchorKey = null; hoverKey = null; render(); return; }
  if(act === "range-off"){ rangeMode = false; anchorKey = null; hoverKey = null; render(); return; }

  if(act === "manage"){ openSheet_ = { type:"manage" }; showSheet(manageSheetHTML()); return; }
  if(act === "whoami"){ openWhoami(); return; }
  if(act === "pick"){ closeSheet(); stopAll(); tid = null; teamDoc = null; phase = "pick"; render(); return; }
  if(act === "join"){ joinTeam(el.getAttribute("data-id")); return; }
  if(act === "share"){ openSheet_ = { type:"share" }; showSheet(shareSheetHTML()); return; }
  if(act === "newteam"){
    openSheet_ = { type:"newteam" }; showSheet(newTeamSheetHTML());
    const i = document.getElementById("ntName"); if(i) i.focus(); return;
  }
  if(act === "nt-create"){
    const n = document.getElementById("ntName"), mm = document.getElementById("ntMe");
    const id = await createTeam(n ? n.value : "", mm ? mm.value : "");
    if(id){ openSheet_ = { type:"share" }; showSheet(shareSheetHTML()); }
    return;
  }
  if(act === "tm-rename"){
    const i = document.getElementById("tmRename");
    await renameTeam(i ? i.value : "");
    return;
  }
  if(act === "am-add"){
    const i = document.getElementById("amName");
    const added = await addMember(i ? i.value : "");
    if(added){ if(i){ i.value = ""; i.focus(); } toast("Added"); }
    return;
  }
  if(act === "setme"){
    meId = el.getAttribute("data-id");
    lsSet("me:"+tid, meId);
    refreshSheet(); render();
    toast("Hi "+esc(me().name.split(" ")[0])+" — tap dates to mark your leave");
    return;
  }
  if(act === "editm"){
    const id = el.getAttribute("data-id");
    openSheet_ = { type:"editmember", id };
    showSheet(editMemberSheetHTML(id));
    const i = document.getElementById("emName");
    if(i){ i.focus(); i.select(); }
    return;
  }
  if(act === "em-save"){
    const i = document.getElementById("emName");
    const ok = await renameMember(el.getAttribute("data-id"), i ? i.value : "");
    if(ok){ openSheet_ = { type:"manage" }; showSheet(manageSheetHTML()); render(); }
    return;
  }
  if(act === "makelead"){ await makeLead(el.getAttribute("data-id")); return; }
  if(act === "rm"){
    const id = el.getAttribute("data-id"), m = member(id);
    if(!m) return;
    if(!confirm("Remove "+m.name+" from "+teamDoc.name+"?\n\nTheir marked leaves are deleted too.")) return;
    await removeMember(id); refreshSheet(); render(); return;
  }
  if(act === "copylink"){ await copy(appLink(), "Link copied"); return; }
  if(act === "copymsg"){
    const ta = document.getElementById("shareMsg");
    await copy(ta ? ta.value : appLink(), "Message copied — paste into WhatsApp");
    return;
  }
  if(act === "forget"){
    if(!confirm("Leave "+teamDoc.name+" on this phone?\n\nThe team and its leaves stay for everyone else. You can rejoin any time from the team list.")) return;
    const gone = tid;
    forgetTeam(gone);
    closeSheet();
    if(known.length){ openTeam(known[0].id); }
    else { stopAll(); tid = null; teamDoc = null; phase = "pick"; render(); }
    return;
  }
  if(act === "export"){ exportJSON(); return; }
  if(act === "close"){ closeSheet(); render(); return; }
});

/* ── Calendar gestures ─────────────────────────────────────────
   Normal mode:  tap = toggle that date.  Press and hold = who's out.
   Range mode:   press, drag, release = mark/unmark the whole run.
                 Or tap the first day and tap the last — no dragging needed.
   Range mode is a deliberate toggle rather than a hidden gesture, because a
   drag-anywhere calendar would swallow the vertical swipe used to scroll. */
(function calendarGestures(){
  let holdTimer = null, downKey = null, downXY = null, movedOff = false, handled = false;
  const HOLD_MS = 420, MOVE_TOL = 12;

  function cellAt(x,y){
    const el = document.elementFromPoint(x,y);
    const day = el && el.closest ? el.closest(".day") : null;
    return (day && !day.classList.contains("pad")) ? day.getAttribute("data-k") : null;
  }
  function paintPreview(){
    const grid = document.getElementById("calGrid");
    if(!grid) return;
    const lo = anchorKey && hoverKey ? (anchorKey < hoverKey ? anchorKey : hoverKey) : anchorKey;
    const hi = anchorKey && hoverKey ? (anchorKey < hoverKey ? hoverKey : anchorKey) : anchorKey;
    for(const c of grid.querySelectorAll(".day")){
      const k = c.getAttribute("data-k");
      const on = lo && k && k >= lo && k <= hi;
      c.classList.toggle("sel", !!on);
    }
  }
  function clearHold(){ if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; } }
  function reset(){ clearHold(); downKey = null; downXY = null; movedOff = false; dragging = false; }

  document.addEventListener("pointerdown", e => {
    if(phase !== "app" || view !== "calendar") return;
    const cell = e.target.closest ? e.target.closest(".day") : null;
    if(!cell || cell.classList.contains("pad")) return;
    const k = cell.getAttribute("data-k");
    if(!k) return;

    handled = false; movedOff = false;
    downKey = k; downXY = { x:e.clientX, y:e.clientY };

    if(rangeMode){
      dragging = true;
      if(!anchorKey){ anchorKey = k; hoverKey = k; }
      else { hoverKey = k; }
      paintPreview();
      return;
    }
    clearHold();
    holdTimer = setTimeout(() => {
      holdTimer = null; handled = true;
      openSheet_ = { type:"day", k };
      showSheet(daySheetHTML(k));
    }, HOLD_MS);
  }, { passive:true });

  document.addEventListener("pointermove", e => {
    if(!downKey) return;
    if(rangeMode && dragging){
      const k = cellAt(e.clientX, e.clientY);
      if(k && k !== hoverKey){ hoverKey = k; paintPreview(); }
      return;
    }
    if(downXY && (Math.abs(e.clientX-downXY.x) > MOVE_TOL || Math.abs(e.clientY-downXY.y) > MOVE_TOL)){
      movedOff = true;      // they're scrolling, not tapping
      clearHold();
    }
  }, { passive:true });

  document.addEventListener("pointerup", async e => {
    if(!downKey) return;
    const startKey = downKey, wasHandled = handled, scrolled = movedOff;

    if(rangeMode && dragging){
      const endKey = cellAt(e.clientX, e.clientY) || hoverKey || startKey;
      reset();
      if(endKey === anchorKey && endKey === startKey){
        // a single tap in range mode: keep the anchor and wait for the second tap
        hoverKey = anchorKey;
        paintPreview();
        return;
      }
      const from = anchorKey || startKey;
      const keys = datesBetween(from, endKey);
      const on = !(meId && daysOf(meId)[from]);
      anchorKey = null; hoverKey = null;
      await writeLeaves(keys, on);
      return;
    }

    reset();
    if(wasHandled || scrolled) return;
    if(startKey < todayKey()){ toast("Past dates can't be changed"); return; }
    if(!meId){ openWhoami(); return; }
    await writeLeaves([startKey], !daysOf(meId)[startKey]);
  });

  document.addEventListener("pointercancel", () => { reset(); });
})();

document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    if(rangeMode){ rangeMode = false; anchorKey = null; hoverKey = null; render(); }
    closeSheet();
  }
  if(e.key !== "Enter") return;
  const id = e.target && e.target.id;
  if(id === "amName") document.querySelector('[data-act="am-add"]')?.click();
  if(id === "tmRename") document.querySelector('[data-act="tm-rename"]')?.click();
  if(id === "emName") document.querySelector('[data-act="em-save"]')?.click();
  if(id === "ntMe")   document.querySelector('[data-act="nt-create"]')?.click();
});

document.getElementById("meBtn").addEventListener("click", () => {
  if(phase !== "app"){ return; }
  openSheet_ = { type:"account" }; showSheet(accountSheetHTML());
});
window.addEventListener("online",  () => { net.online = true;  renderStatus(); });
window.addEventListener("offline", () => { net.online = false; renderStatus(); });

/* ═══════════════════════════════════════════════════════════
   ⑩  Boot
   ═══════════════════════════════════════════════════════════ */
loadKnown();
if(!CONFIGURED){
  phase = "pick"; render();
} else {
  render();
  onAuthStateChanged(auth, u => {
    if(!u) return;
    watchAllTeams();
    const last = lsGet("lastTeam");
    const start = (last && known.some(t => t.id === last)) ? last : (known[0] ? known[0].id : null);
    if(start) openTeam(start);
    else { phase = "pick"; render(); }
  });
  signInAnonymously(auth).catch(() => {
    phase = "pick";
    net.error = "auth";
    $body.innerHTML = `<div class="card gate"><h2>Sign-in is switched off</h2>
      <p>In the Firebase console go to <b>Authentication → Sign-in method</b> and enable
      <b>Anonymous</b>, then reload. Nobody has to type anything — this happens invisibly.</p></div>`;
    renderStatus();
  });
}

if("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persisted().then(a => a ? true : navigator.storage.persist()).catch(() => {});
}
