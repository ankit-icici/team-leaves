<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E3530F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Team Leaves">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>Team Leaves</title>
<link rel="preload" href="mulish.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Mulish, the ICICI Bank brand typeface (SIL Open Font License, see mulish-OFL.txt),
     cut down to Latin characters from the brand master so the app stays small. */
  @font-face{font-family:"Mulish";src:url("mulish.woff2") format("woff2");
             font-weight:200 1000;font-style:normal;font-display:swap}
  :root{
    /* ICICI Bank brand orange #E3530F and maroon #94292E. --o-700 is a darker
       orange for small text on white, where the brand orange is too light to read. */
    --o-500:#E3530F; --o-600:#C9480C; --o-700:#B23F0A;
    --o-100:#FCE0D2; --o-050:#FEF3EC;
    --maroon:#94292E;
    --ink:#2A1C14; --ink-2:#7A6455; --ink-3:#A79285;
    --line:#EFE1D5; --paper:#FFFBF7; --white:#FFFFFF; --green:#16A34A;
    --sans:"Mulish",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    --r:16px; --shadow:0 1px 2px rgba(42,28,20,.05), 0 8px 24px rgba(42,28,20,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input{font:inherit;color:inherit}
  :focus-visible{outline:2.5px solid var(--o-600);outline-offset:2px;border-radius:6px}
  .wrap{max-width:560px;margin:0 auto;padding:0 0 130px;overflow-x:hidden}

  .top{position:sticky;top:0;z-index:30;background:var(--o-500);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 18px;border-radius:0 0 22px 22px;box-shadow:0 6px 22px rgba(227,83,15,.22)}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;flex-direction:column;min-width:0}
  .brand h1{margin:0;font-size:19px;font-weight:750;letter-spacing:-.35px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .tick{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;opacity:.75;white-space:nowrap;margin-top:2px}
  .me-btn{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);padding:6px 10px 6px 6px;border-radius:999px;font-size:13px;font-weight:600;max-width:48%;flex:0 0 auto}
  .me-btn .av{width:22px;height:22px;font-size:10px;box-shadow:0 0 0 1.5px rgba(255,255,255,.5)}
  .me-btn span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .me-btn .caret{opacity:.8;font-size:10px}
  .today-line{margin-top:14px;font-size:13.5px;font-weight:500;opacity:.95;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .today-line b{font-weight:750}
  .dotsep{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.6)}

  .teams{display:flex;gap:7px;overflow-x:auto;padding:14px 16px 0;scrollbar-width:none}
  .teams::-webkit-scrollbar{display:none}
  .tbtn{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--white);border:1px solid var(--line);font-size:13.5px;font-weight:650;color:var(--ink-2);white-space:nowrap;display:flex;align-items:center;gap:6px}
  .tbtn[aria-pressed="true"]{background:var(--o-500);border-color:var(--o-500);color:#fff}
  .tbtn .crown{font-size:10px;opacity:.9}
  .tbtn.add{border-style:dashed;color:var(--ink-3)}

  .seg{display:flex;gap:4px;margin:14px 16px 0;padding:4px;background:var(--o-100);border-radius:999px}
  .seg button{flex:1;padding:9px 4px;border-radius:999px;font-size:13.5px;font-weight:650;color:var(--o-700);transition:background .18s,color .18s,box-shadow .18s}
  .seg button[aria-selected="true"]{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(42,28,20,.12)}

  .chips{display:flex;gap:7px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 12px 6px 7px;border-radius:999px;background:var(--white);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
  .chip.only-text{padding-left:12px}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip .av{width:20px;height:20px;font-size:9.5px}

  .card{background:var(--white);margin:14px 16px;border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow)}

  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 6px}
  .cal-head h2{margin:0;font-size:20px;font-weight:750;letter-spacing:-.4px}
  .cal-head h2 em{font-style:normal;font-weight:400;color:var(--ink-3)}
  .nav{display:flex;gap:6px}
  .nav button{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);font-size:15px;background:var(--paper)}
  .nav button:active{background:var(--o-100)}
  .dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:6px 8px 2px;font-size:10.5px;font-weight:700;letter-spacing:.8px;color:var(--ink-3);text-align:center}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;padding:2px 8px 12px}
  .day{position:relative;aspect-ratio:1/1.12;min-width:0;overflow:hidden;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding-top:5px;gap:3px;background:var(--paper);border:1px solid transparent;transition:transform .1s}
  .day:active{transform:scale(.94)}
  .day.pad{background:transparent;pointer-events:none}
  .day.weekend{background:#FBF6F1}
  .day .n{font-size:13px;font-weight:600;color:var(--ink)}
  .day.past .n{color:var(--ink-3)}
  .day.today{border-color:var(--o-500);background:var(--o-050)}
  .day.today .n{color:var(--o-700);font-weight:800}
  .day .stack{display:flex;gap:2px;align-items:center;justify-content:center;flex-wrap:nowrap;max-width:100%;overflow:hidden;padding:0 1px}
  .day .av{width:16px;height:16px;font-size:8px}
  .day .more{font-size:9.5px;font-weight:700;color:var(--ink-3)}
  .day.solo-on{background:var(--o-500);border-color:var(--o-500)}
  .day.solo-on .n{color:#fff;font-weight:750}
  .day .mine{position:absolute;bottom:4px;width:15px;height:3px;border-radius:2px;background:var(--maroon)}
  .rangebar{display:flex;align-items:center;gap:10px;padding:2px 14px 8px;font-size:12px;font-weight:600;color:var(--ink-3)}
  .rangebar span{flex:1;min-width:0}
  .rangebar button{flex:0 0 auto;font-size:12px;font-weight:750;letter-spacing:.3px;color:var(--o-700);background:var(--o-050);border:1px solid var(--o-100);padding:6px 12px;border-radius:999px}
  .rangebar.on{color:var(--maroon)}
  .rangebar.on button{background:var(--maroon);border-color:var(--maroon);color:#fff}
  .grid.picking .day{touch-action:none}
  .day.sel{box-shadow:inset 0 0 0 2.5px var(--maroon)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 16px 4px;font-size:11.5px;color:var(--ink-3);font-weight:600}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:750;letter-spacing:.2px;flex:0 0 auto;line-height:1}

  .person{padding:14px 16px;border-bottom:1px solid var(--line)}
  .person:last-child{border-bottom:0}
  .p-top{display:flex;align-items:center;gap:10px}
  .p-top .av{width:34px;height:34px;font-size:12.5px}
  .p-name{font-weight:700;font-size:15px;letter-spacing:-.2px}
  .p-sub{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:1px}
  .p-count{margin-left:auto;text-align:right;font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.6px;text-transform:uppercase}
  .p-count b{display:block;font-size:19px;letter-spacing:-.4px;color:var(--ink)}
  .llist{list-style:none;margin:11px 0 0;padding:0}
  .llist li{display:flex;align-items:baseline;gap:10px;padding:9px 0;font-size:14.5px;border-top:1px dashed var(--line)}
  .llist li:first-child{border-top:1px solid var(--line)}
  .llist .ld{font-weight:650;color:var(--ink)}
  .llist .lt{margin-left:auto;font-size:10.5px;font-weight:750;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
  .llist .lt.hi{color:var(--o-700)}
  .llist .lt + .lt{margin-left:8px}
  .none{font-size:13.5px;color:var(--ink-3);font-style:italic;margin-top:9px}

  .scrim{position:fixed;inset:0;background:rgba(42,28,20,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--white);border-radius:24px 24px 0 0;padding:0 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .28s cubic-bezier(.22,.9,.28,1);max-height:88vh;overflow-y:auto;max-width:560px;margin:0 auto;box-shadow:0 -10px 40px rgba(42,28,20,.2)}
  .sheet.on{transform:translateY(0)}
  /* Sticky so the way out stays reachable on a long sheet — iPhone standalone
     has no system Back, so this control is the only one on that platform. */
  .shead{position:sticky;top:0;z-index:3;background:var(--white);
         display:grid;grid-template-columns:44px 1fr 44px;align-items:center;
         /* spans the sheet's full width and owns its top padding, so nothing
            can scroll through the gap above it */
         margin:0 -18px 6px;padding:10px 18px 8px}
  .handle{width:38px;height:4px;border-radius:99px;background:var(--line);
          grid-column:2;margin:0 auto}
  .navback{grid-column:1;justify-self:start;width:44px;height:44px;
           display:grid;place-items:center;border-radius:999px;
           font-size:19px;line-height:1;color:var(--ink-2)}
  .navback:active{background:var(--o-050);color:var(--o-700)}
  .sheet h3{margin:0 0 2px;font-size:20px;font-weight:750;letter-spacing:-.4px}
  .sheet .sub{font-size:13px;color:var(--ink-3);font-weight:600;margin-bottom:16px}
  .act{display:flex;flex-direction:column;gap:8px;margin:4px 0 6px}
  .btn{width:100%;padding:14px;border-radius:14px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
  .btn.primary{background:var(--o-500);color:#fff}
  .btn.primary:active{background:var(--o-600)}
  .btn.ghost{background:var(--o-050);color:var(--o-700);border:1px solid var(--o-100)}
  .btn.danger{background:#FFF1F2;color:#9F1239;border:1px solid #FFE0E3}
  .btn.flat{background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .out-list{margin:0 0 18px;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
  .out-list li{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600}
  .out-list .av{width:28px;height:28px;font-size:11px}
  .empty-out{font-size:14px;color:var(--ink-3);margin:0 0 18px}
  .sug{margin:-6px 0 12px;border:1px solid var(--line);border-radius:14px;
       overflow:hidden;background:var(--paper)}
  .sugrow{display:block;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
  .sugrow:last-of-type{border-bottom:0}
  .sugrow b{display:block;font-size:14px;font-weight:650}
  .sugrow span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
  .sugrow:active{background:var(--o-050)}
  .sugnote{font-size:11.5px;color:var(--ink-3);line-height:1.5;margin:0;
           padding:8px 12px;border-top:1px solid var(--line);background:var(--white)}
  .fld{margin:0 0 12px}
  .fld label{display:block;font-size:10.5px;font-weight:750;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
  .fld input{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:var(--paper);font-size:15px}
  .fld input:focus{border-color:var(--o-500);background:#fff;outline:none}
  .mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .mlist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .mlist li:last-child{border-bottom:0}
  .mlist .av{width:32px;height:32px;font-size:12px}
  .mlist .who{flex:1;min-width:0}
  .mlist .who b{display:block;font-weight:650;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mlist .who span{display:block;font-size:11.5px;color:var(--ink-3)}
  .mlist .lead{font-size:10px;font-weight:750;letter-spacing:.6px;color:var(--o-700);background:var(--o-050);padding:3px 7px;border-radius:999px;flex:0 0 auto}
  .mlist .pick{font-size:12.5px;font-weight:700;color:var(--o-700);flex:0 0 auto}
  .mlist .mini{font-size:16px;color:var(--ink-3);padding:2px 5px;line-height:1;flex:0 0 auto}
  .ver{float:right;font-variant-numeric:tabular-nums;opacity:.75}
  .mlist .av.dim{opacity:.38}
  .mlist li.ghost .who b{font-weight:600;color:var(--ink-2)}
  .mlist .grouphd{padding:14px 0 6px;border-bottom:0;font-size:11px;font-weight:750;
                  letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3);display:block}

  .linkbox{background:var(--o-050);border:1px solid var(--o-100);color:var(--o-700);padding:12px;border-radius:12px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;margin:0 0 12px;line-height:1.5}
  .gate{padding:26px 20px}
  .gate h2{margin:0 0 8px;font-size:23px;font-weight:750;letter-spacing:-.5px}
  .gate p{font-size:14.5px;color:var(--ink-2);margin:0 0 14px}
  .gate code{background:var(--o-050);border:1px solid var(--o-100);color:var(--o-700);padding:2px 6px;border-radius:6px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .steps{list-style:none;margin:16px 0 0;padding:0;font-size:13.5px;color:var(--ink-2)}
  .steps li{display:flex;gap:10px;padding:5px 0;align-items:flex-start}
  .steps b{flex:0 0 auto;width:19px;height:19px;border-radius:6px;background:var(--o-100);color:var(--o-700);font-size:11px;display:grid;place-items:center;font-weight:800;margin-top:1px}
  .or{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:11px;font-weight:750;letter-spacing:1px;margin:16px 0}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

  .drift{padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-color:var(--o-100);background:var(--o-050)}
  .drift b{font-size:14px;font-weight:750;color:var(--maroon)}
  .drift span{font-size:12.5px;color:var(--ink-2);line-height:1.55}
  .drift button{align-self:flex-start;margin-top:4px;font-size:12.5px;font-weight:750;color:#fff;background:var(--maroon);padding:8px 14px;border-radius:999px}
  .hint{padding:0 20px;font-size:12.5px;color:var(--ink-3);text-align:center;line-height:1.6}
  .skel{padding:70px 0;text-align:center;color:var(--ink-3);font-size:13.5px;font-weight:600}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:90;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:650;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 8px 24px rgba(42,28,20,.28);max-width:88vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .status{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);padding:8px 16px 0}
  .status i{width:6px;height:6px;border-radius:50%;background:var(--green);flex:0 0 auto}
  .status i.wait{background:var(--o-500)}
  .status i.bad{background:#DC2626}
  @media (max-width:400px){
    .grid{gap:2px;padding:2px 6px 12px}
    .dow{padding:6px 6px 2px}
    .day .av{width:14px;height:14px;font-size:7.5px}
    .day .n{font-size:12px}
    .day .more{font-size:9px}
    .card{margin:12px 12px}
    .legend{padding:0 12px 4px;gap:10px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <h1 id="hTitle">Team Leaves</h1>
        <span class="tick" id="hTick"></span>
      </div>
      <button class="me-btn" id="meBtn" aria-label="You and your teams">
        <span class="av" id="meAv">+</span><span class="nm" id="meName">Pick your name</span><span class="caret">▾</span>
      </button>
    </div>
    <div class="today-line" id="todayLine"></div>
  </header>

  <div id="body"><div class="skel">Starting up…</div></div>
  <div class="status" id="statusNote"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script type="module">
/* ═══════════════════════════════════════════════════════════
   ①  PASTE YOUR FIREBASE CONFIG HERE  (same six values as before)
   ═══════════════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey:            "AIzaSyAuD0vD6OoXH7fK-zhyDsSNvwU2jb_GaRU",
  authDomain:        "team-leaves-270f6.firebaseapp.com",
  projectId:         "team-leaves-270f6",
  storageBucket:     "team-leaves-270f6.firebasestorage.app",
  messagingSenderId: "241879513784",
  appId:             "1:241879513784:web:013ceeecfd42d469aa524d"
};

/* ═══════════════════════════════════════════════════════════ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, getDoc, getDocs, onSnapshot, setDoc, runTransaction, deleteField
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CONFIGURED = !String(firebaseConfig.apiKey).startsWith("PASTE_");
let auth = null, db = null;
if(CONFIGURED){
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = initializeFirestore(app, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
  });
}

/* ═══════════════════════════════════════════════════════════
   ②  State
   ═══════════════════════════════════════════════════════════ */
let allTeams = [];     // [{id, name, size, members}]  EVERY team — the picker list, and
                       // the only source the people suggestions need
let known = [];        // [{id, name}]  teams this person has joined on this phone
let tid = null;        // current team id
let teamDoc = null;    // { name, leadId, members:[{id,name,color}], formerMembers:[{id,name,color,removedAt}] }
let yearData = {};     // { "2026": { memberId: { dateKey: type } } }
let leaves = {};       // flattened { memberId: { dateKey: type } }
let meId = null;       // which member I am, on THIS device, for THIS team
let view = "calendar";
let filter = "all";
let cursor = startOfMonth(new Date());
let phase = "boot";    // boot | pick | app
let subs = { all:null, team:null, years:{} };
let net = { online: navigator.onLine, cached:false, stale:false, pending:0, error:null };
let cacheState = {};      // one entry per live listener
let staleTimer = null;
let openSheet_ = null;
let pendingRestore = null;   // a parsed backup waiting for confirmation
let mismatch = null;         // {checked:bool, rows:[{tid,name,mid,missing:[],extra:[]}]}
let mismatchChecked = false;
let rangeMode = false;      // "Select range" toggle
let anchorKey = null;       // first date of a range being built
let hoverKey = null;        // date currently under the finger
let dragging = false;

/* Removing someone parks them here instead of deleting their dates. Bounded so
   the team document can't grow without limit on a long-lived team. */
const FORMER_CAP = 200;
/* Bump this together with CACHE in sw.js on every upload — it is the only way
   to tell from a phone which version is actually running. */
const APP_VERSION = "v23";
const COLORS = ["#E3530F","#94292E","#B45309","#0F766E","#9A3412","#1D4ED8",
                "#166534","#BE185D","#6D28D9","#193D6C","#7C2D12","#0E7490"];
/* Colours saved on people before the move to ICICI Bank colours (v23). Mapped
   when drawn, so nobody's saved record has to be rewritten. */
const OLD_COLORS = { "#F37E20":"#E3530F", "#8A1538":"#94292E", "#A16207":"#193D6C" };
const DOW = ["M","T","W","T","F","S","S"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ═══════════════════════════════════════════════════════════
   ③  Helpers  (function declarations — hoisted, so `cursor` above works)
   ═══════════════════════════════════════════════════════════ */
function pad(n){ return n < 10 ? "0"+n : ""+n; }
function key(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parse(k){ const p = k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function addMonths(d,n){ return new Date(d.getFullYear(), d.getMonth()+n, 1); }
function daysInMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function todayKey(){ return key(new Date()); }
function isWeekend(d){ const g = d.getDay(); return g === 0 || g === 6; }
function mondayIndex(d){ return (d.getDay()+6)%7; }
function nextDayKey(k){ const d = parse(k); d.setDate(d.getDate()+1); return key(d); }
function datesBetween(a,b){
  if(a > b){ const t = a; a = b; b = t; }
  const out = []; let k = a;
  for(let guard = 0; guard < 800; guard++){ out.push(k); if(k === b) break; k = nextDayKey(k); }
  return out;
}
function longDate(k){
  const d = parse(k);
  const wd = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()];
  return wd+", "+d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear();
}
function esc(s){ return String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function initials(name){
  const p = String(name||"").trim().split(/\s+/).filter(Boolean);
  if(!p.length) return "?";
  if(p.length === 1) return p[0].slice(0,2).toUpperCase();
  return (p[0][0]+p[p.length-1][0]).toUpperCase();
}
function roster(){ return teamDoc && Array.isArray(teamDoc.members) ? teamDoc.members : []; }
function member(id){ return roster().find(m => m.id === id) || null; }
/* People removed from the roster. They are invisible everywhere the app draws
   from roster(), but their marked dates stay in the year documents, dormant,
   so adding them back brings their leaves with them. */
function formerRoster(){ return teamDoc && Array.isArray(teamDoc.formerMembers) ? teamDoc.formerMembers : []; }
function formerMember(id){ return formerRoster().find(m => m.id === id) || null; }
function shortWhen(iso){
  const d = new Date(iso);
  if(!iso || isNaN(d.getTime())) return "";
  return d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear();
}
function me(){ return member(meId); }
function iAmLead(){ return !!(teamDoc && meId && teamDoc.leadId === meId); }
function leadName(){ const m = member(teamDoc ? teamDoc.leadId : null); return m ? m.name : "nobody yet"; }
function personColor(m){ const c = (m && m.color) || COLORS[0]; return OLD_COLORS[c] || c; }
function avatar(m, cls){
  return `<span class="av ${cls||""}" style="background:${personColor(m)}">${esc(initials(m.name))}</span>`;
}
function daysOf(id){ return leaves[id] || {}; }
function outOn(k){
  const list = [];
  for(const m of roster()){
    const t = daysOf(m.id)[k];
    if(t) list.push({ m, type:t });
  }
  return list;
}
function upcoming(id){
  const t = todayKey();
  return Object.keys(daysOf(id)).sort().filter(k => k >= t);
}
/* Random team id. NOTE: this is just a name, not a secret. Everyone can see
   the full list of teams — separation here is in the app, not on the server. */
function newTeamId(){
  const bytes = new Uint8Array(8);
  (crypto || window.crypto).getRandomValues(bytes);
  return "t"+Array.from(bytes).map(b => b.toString(36).padStart(2,"0")).join("").slice(0,12);
}
function newMemberId(){
  return "m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
}
function appLink(){
  return location.origin + location.pathname;
}

/* ═══════════════════════════════════════════════════════════
   ④  Local memory  (which teams this device knows, and who I am in each)
   ═══════════════════════════════════════════════════════════ */
function lsGet(k){ try { return localStorage.getItem("tl:"+k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem("tl:"+k, v); } catch(e){} }
function loadKnown(){
  try { const j = JSON.parse(lsGet("known") || "[]"); known = Array.isArray(j) ? j : []; }
  catch(e){ known = []; }
}
function saveKnown(){ lsSet("known", JSON.stringify(known)); }
function rememberTeam(id, name){
  const at = known.findIndex(t => t.id === id);
  if(at === -1) known.push({ id, name: name || "Team" });
  else if(name) known[at].name = name;
  saveKnown();
}
function forgetTeam(id){
  known = known.filter(t => t.id !== id);
  saveKnown();
  // remember the decision, or adoptMyTeams() would hand the team straight back
  const left = loadLeft();
  if(!left.includes(id)){ left.push(id); lsSet("left", JSON.stringify(left)); }
}
function loadLeft(){
  try { const j = JSON.parse(lsGet("left") || "[]"); return Array.isArray(j) ? j : []; }
  catch(e){ return []; }
}

/* ── Who this phone is ───────────────────────────────────────────
   A member id is minted once for a person and then travels with them: when a
   lead adds someone who is already on another team, the same id is reused. So
   the id is effectively that person's identity, and a phone that has claimed it
   in one team can recognise itself in every other team without being asked
   again. Ids are random, so a match is never a coincidence. */
function myIds(){
  const out = new Set();
  const solo = lsGet("meId"); if(solo) out.add(solo);
  for(const t of known){ const v = lsGet("me:"+t.id); if(v) out.add(v); }
  return out;
}
function claimMeId(teamId, mid){
  meId = mid;
  lsSet("me:"+teamId, mid);
  lsSet("meId", mid);
}
/* Only ever act on an unambiguous match — if two roster entries carry ids this
   phone owns, something is wrong and the person should pick for themselves. */
function resolveMeId(teamId, members){
  const explicit = lsGet("me:"+teamId);
  if(explicit) return explicit;
  const mine = myIds();
  const hit = (members || []).filter(m => mine.has(m.id));
  return hit.length === 1 ? hit[0].id : null;
}
/* A lead added me to a team from their phone: pick it up rather than waiting to
   be told. Teams deliberately left behind stay left behind. */
function adoptMyTeams(){
  const mine = myIds();
  if(!mine.size) return;
  const left = loadLeft();
  let n = 0, first = null;
  for(const t of allTeams){
    if(known.some(k => k.id === t.id) || left.includes(t.id)) continue;
    const hit = (t.members || []).filter(m => mine.has(m.id));
    if(hit.length !== 1) continue;
    rememberTeam(t.id, t.name);
    lsSet("me:"+t.id, hit[0].id);
    if(!first) first = t.id;
    n++;
  }
  if(n){
    toast(n === 1 ? "You've been added to a team" : "You've been added to "+n+" teams");
    /* Sitting on the first-run team list with nothing open: go straight in.
       Staying put left people hunting for a team their phone already had.
       A person who opened the list on purpose ("Join another team") stays. */
    if(phase === "pick" && !tid && !navStack.some(x => x.screen === "pick")) openTeam(first);
    else render();
  }
}

/* Everyone on any roster anywhere, folded together by member id. Costs nothing:
   these rosters are already in memory from the teams listener. */
function knownPeople(){
  const byId = new Map();
  for(const t of allTeams){
    for(const m of (t.members || [])){
      const e = byId.get(m.id) || { id:m.id, name:m.name, teams:[] };
      e.name = m.name;
      if(!e.teams.includes(t.name)) e.teams.push(t.name);
      byId.set(m.id, e);
    }
  }
  return Array.from(byId.values());
}
function joinTeam(id){
  const t = allTeams.find(x => x.id === id);
  rememberTeam(id, t ? t.name : "Team");
  // rejoining a team left earlier: it counts as theirs again for mirroring
  const left = loadLeft();
  if(left.includes(id)) lsSet("left", JSON.stringify(left.filter(x => x !== id)));
  lsSet("me:"+id, "");
  closeSheet();
  openTeam(id);
}

/* ═══════════════════════════════════════════════════════════
   ⑤  Listeners
   ═══════════════════════════════════════════════════════════ */
function watchAllTeams(){
  if(subs.all) return;
  subs.all = onSnapshot(collection(db, "teams"),
    snap => {
      /* A team marked hidden (duplicates, tests, people who have left) is left out
         everywhere, as if it didn't exist. Its data stays in the database, so
         clearing the flag in the Firebase console brings it back. */
      allTeams = snap.docs.filter(d => !(d.data() || {}).hidden).map(d => {
        const v = d.data() || {};
        const mem = Array.isArray(v.members) ? v.members : [];
        return { id:d.id, name:v.name || "Untitled team", members:mem, size:mem.length };
      }).sort((a,b) => String(a.name).localeCompare(String(b.name)));
      // a phone that had joined a team since hidden drops it (not added to "left",
      // so it comes back on its own if the team is ever un-hidden)
      const gone = new Set(snap.docs.filter(d => (d.data() || {}).hidden).map(d => d.id));
      let changed = false;
      if(known.some(k => gone.has(k.id))){ known = known.filter(k => !gone.has(k.id)); changed = true; }
      for(const k of known){
        const hit = allTeams.find(t => t.id === k.id);
        if(hit && hit.name !== k.name){ k.name = hit.name; changed = true; }
      }
      if(changed) saveKnown();
      if(tid && gone.has(tid)){
        stopAll(); tid = null; teamDoc = null;
        if(known.length){ openTeam(known[0].id); return; }
        phase = "pick";
      }
      adoptMyTeams();
      if(phase === "pick") render();
    },
    err => { net.error = err.code || "unavailable"; render(); }
  );
}

function stopAll(){
  cacheState = {};
  pendingSrc = {}; updatePending();
  net.cached = false; net.stale = false;
  if(staleTimer){ clearTimeout(staleTimer); staleTimer = null; }
  if(subs.team){ subs.team(); subs.team = null; }
  for(const y of Object.keys(subs.years)){ subs.years[y](); }
  subs.years = {};
}

function openTeam(id){
  stopAll();
  tid = id;
  teamDoc = null; yearData = {}; leaves = {}; filter = "all";
  meId = lsGet("me:"+id);
  lsSet("lastTeam", id);
  phase = "boot"; render();

  subs.team = onSnapshot(doc(db, "teams", id),
    snap => {
      if(tid !== id) return;
      if(snap.exists() && snap.data().hidden) return;   // the teams listener moves us off it
      if(!snap.exists()){
        net.error = "missing";
        phase = "pick";
        forgetTeam(id);
        render();
        return;
      }
      teamDoc = snap.data();
      setCached("team", snap.metadata.fromCache);
      net.error = null;
      rememberTeam(id, teamDoc.name);
      if(meId && !member(meId)){ meId = null; lsSet("me:"+id, ""); }
      if(!meId){
        const auto = resolveMeId(id, roster());
        if(auto){ claimMeId(id, auto); toast("You're on "+esc(teamDoc.name)+" — tap dates to mark your leave"); }
      }
      phase = "app";
      const y = new Date().getFullYear();
      watchYear(y); watchYear(y+1);
      render();
      if(!mismatchChecked && meId && myTargets().targets.length > 1){
        setTimeout(() => { checkMismatch().then(() => render()); }, 1200);
      }
    },
    err => {
      net.error = err.code || "unavailable";
      phase = teamDoc ? "app" : "pick";
      render();
    }
  );
}

function watchYear(y){
  y = String(y);
  if(subs.years[y]) return;
  const forTeam = tid;
  // metadata changes too: that is the only event that says a pending write has
  // reached the server, which the sync warning needs to clear itself
  subs.years[y] = onSnapshot(doc(db, "teams", forTeam, "years", y), { includeMetadataChanges:true },
    snap => {
      if(tid !== forTeam) return;
      yearData[y] = (snap.exists() && snap.data().days) ? snap.data().days : {};
      // an empty future year is normal and must not look like a connection fault
      setCached("year:"+y, snap.metadata.fromCache && snap.exists());
      setPending("year:"+y, snap.metadata.hasPendingWrites);
      rebuild(); render();
    },
    err => { net.error = err.code || "unavailable"; render(); }
  );
}

/* ── Changes not yet on the server ─────────────────────────────
   Marked leaves are saved on the phone at once and sent when there's signal.
   Until they arrive, clearing the app's storage would lose them, so the app
   says so. Two sources: writes made in this session (counted exactly), and any
   year document the database reports as still holding unsent changes (which
   also covers changes made before the app was last closed). */
let unsynced = 0;          // leave days written this session, not yet confirmed
let pendingSrc = {};       // per listener: does it report unsent changes?
let pendingSince = 0;
function setPending(src, on){
  pendingSrc[src] = !!on;
  updatePending();
}
function updatePending(){
  const was = net.pending;
  net.pending = unsynced > 0 || Object.keys(pendingSrc).some(k => pendingSrc[k]);
  if(net.pending && !was){
    pendingSince = Date.now();
    setTimeout(() => { if(net.pending) render(); }, 6100);   // bring up the warning if it lingers
  }
  if(!net.pending) pendingSince = 0;
}
/* Shown once changes have waited a few seconds, or straight away offline. */
function showSyncWarning(){
  return net.pending && (!net.online || (pendingSince && Date.now() - pendingSince > 6000));
}
function syncWarningHTML(){
  if(!showSyncWarning()) return "";
  const what = unsynced > 0 ? unsynced+(unsynced === 1 ? " change" : " changes") : "Your latest changes";
  return `<div class="card drift" role="status"><b>${what} waiting to sync</b>
    <span>Saved on this phone. ${net.online ? "Sending now" : "They'll reach your team when you're back online"}.
    Until then, don't clear this app's data or uninstall it.</span></div>`;
}

/* Each listener reports separately whether its data came from the local cache.
   A warm start is ALWAYS cache-first, and a year document that doesn't exist yet
   reports cache too — so "cached" on its own means nothing. Only sustained
   cache-only data for several seconds indicates a real connection problem. */
function setCached(src, isCached){
  cacheState[src] = !!isCached;
  net.cached = Object.keys(cacheState).some(k => cacheState[k]);
  if(!net.cached){
    if(staleTimer){ clearTimeout(staleTimer); staleTimer = null; }
    if(net.stale){ net.stale = false; renderStatus(); }
    return;
  }
  if(!staleTimer && !net.stale){
    staleTimer = setTimeout(() => {
      staleTimer = null;
      if(net.cached){ net.stale = true; renderStatus(); }
    }, 7000);
  }
}

function rebuild(){
  leaves = {};
  for(const y of Object.keys(yearData)){
    const byMember = yearData[y] || {};
    for(const mid of Object.keys(byMember))
      leaves[mid] = Object.assign(leaves[mid] || {}, byMember[mid] || {});
  }
}

/* ═══════════════════════════════════════════════════════════
   ⑥  Writes
   ═══════════════════════════════════════════════════════════ */
async function createTeam(name, myName){
  name = String(name||"").trim(); myName = String(myName||"").trim();
  if(!name){ toast("Give the team a name"); return null; }
  if(!myName){ toast("Enter your own name"); return null; }
  const id = newTeamId(), mid = newMemberId();
  try {
    await setDoc(doc(db, "teams", id), {
      name,
      leadId: mid,
      members: [{ id:mid, name:myName, color:COLORS[0] }],
      createdAt: new Date().toISOString()
    });
    rememberTeam(id, name);
    lsSet("me:"+id, mid);
    openTeam(id);
    return id;
  } catch(e){ toast("Couldn't create the team. Are you online?"); return null; }
}

/* Copy someone's still-to-come leaves in from the other teams they are on, so
   a person added today doesn't look free for dates they already booked. */
async function copyUpcomingInto(mid){
  const today = todayKey(), dates = new Set();
  for(const t of allTeams){
    if(t.id === tid) continue;
    if(!(t.members || []).some(m => m.id === mid)) continue;
    try {
      const ys = await getDocs(collection(db, "teams", t.id, "years"));
      ys.forEach(d => {
        const days = ((d.data() || {}).days || {})[mid] || {};
        for(const k of Object.keys(days)) if(k >= today) dates.add(k);
      });
    } catch(e){}
  }
  if(!dates.size) return 0;
  const byYear = {};
  for(const k of dates){ const y = k.slice(0,4); (byYear[y] = byYear[y] || {})[k] = "full"; }
  for(const y of Object.keys(byYear))
    await setDoc(doc(db, "teams", tid, "years", y), { days: { [mid]: byYear[y] } }, { merge:true });
  return dates.size;
}

/* opts.id — add this exact person (picked from the suggestions), reusing the
   member id they already have elsewhere rather than minting a new one. */
async function addMember(name, opts){
  opts = opts || {};
  name = String(name||"").trim().replace(/\s+/g," ");
  if(!name){ toast("Enter a name"); return null; }
  if(opts.id && roster().some(m => m.id === opts.id)){
    toast(esc(name)+" is already on this team"); return null;
  }
  if(roster().some(m => m.name.toLowerCase() === name.toLowerCase())){
    toast(esc(name)+" is already on this team"); return null;
  }
  /* If this name was removed before, take back their original member id — the
     dormant dates in the year documents are keyed by it, so they reappear. */
  let finalId = null, restored = false;
  try {
    await runTransaction(db, async tx => {
      const ref = doc(db, "teams", tid);
      const snap = await tx.get(ref);
      if(!snap.exists()) throw new Error("gone");
      const d = snap.data() || {};
      const cur = Array.isArray(d.members) ? d.members : [];
      const dup = cur.find(m => m.name.toLowerCase() === name.toLowerCase());
      if(dup){ finalId = dup.id; restored = false; return; }
      const former = Array.isArray(d.formerMembers) ? d.formerMembers : [];
      const prev = former.find(x => x.id === opts.id) ||
                   (opts.id ? null : former.find(x => String(x.name).toLowerCase() === name.toLowerCase()));
      const entry = { id: opts.id || (prev ? prev.id : newMemberId()), name,
                      color: (prev && prev.color) || COLORS[cur.length % COLORS.length] };
      finalId = entry.id; restored = !!prev;
      tx.set(ref, { members: cur.concat([entry]),
                    formerMembers: former.filter(x => x.id !== entry.id) }, { merge:true });
    });
    if(!finalId) return null;
    let copied = 0;
    if(opts.id) { try { copied = await copyUpcomingInto(finalId); } catch(e){} }
    return { id:finalId, restored, copied };
  } catch(e){ toast("Adding people needs internet."); return null; }
}

/* A lead can fix anyone's name in their own team. Anyone can fix their own,
   and that follows them to every team they're on (same member id). */
async function renameMember(id, name){
  const self = !!meId && id === meId;
  if(!iAmLead() && !self){ toast("Only the team lead can edit other people's names"); return false; }
  name = String(name||"").trim().replace(/\s+/g," ");
  if(!name){ toast("Enter a name"); return false; }
  const existing = member(id);
  if(!existing) return false;
  if(name === existing.name) return true;
  if(roster().some(m => m.id !== id && m.name.toLowerCase() === name.toLowerCase())){
    toast("Someone else on this team already has that name"); return false;
  }
  const where = [tid];
  if(self) for(const t of allTeams)
    if(t.id !== tid && (t.members || []).some(m => m.id === id)) where.push(t.id);
  try {
    for(const t of where){
      await runTransaction(db, async tx => {
        const ref = doc(db, "teams", t);
        const snap = await tx.get(ref);
        if(!snap.exists()) return;
        const cur = Array.isArray(snap.data().members) ? snap.data().members : [];
        tx.set(ref, { members: cur.map(m => m.id === id ? Object.assign({}, m, { name }) : m) },
               { merge:true });
      });
    }
    toast(where.length > 1 ? "Name updated in your "+where.length+" teams" : "Name updated");
    return true;
  } catch(e){ toast("Editing names needs internet."); return false; }
}

/* Removal is reversible: the person moves out of members and into
   formerMembers, and their dates are left exactly where they are. Nothing draws
   from formerMembers, so they vanish from the calendar, the list, the chips and
   backups — but "Add back" in Manage team returns them, dates and all.
   purgeFormer() is the one path that actually deletes the dates. */
async function removeMember(id){
  if(id === teamDoc.leadId){ toast("Hand over the lead role first"); return; }
  const gone = member(id);
  try {
    await runTransaction(db, async tx => {
      const ref = doc(db, "teams", tid);
      const snap = await tx.get(ref);
      if(!snap.exists()) throw new Error("gone");
      const d = snap.data() || {};
      const cur = Array.isArray(d.members) ? d.members : [];
      const leaving = cur.find(m => m.id === id);
      if(!leaving) return;
      const former = (Array.isArray(d.formerMembers) ? d.formerMembers : []).filter(x => x.id !== id);
      former.push({ id:leaving.id, name:leaving.name, color:leaving.color || COLORS[0],
                    removedAt:new Date().toISOString() });
      tx.set(ref, { members: cur.filter(m => m.id !== id),
                    formerMembers: former.slice(-FORMER_CAP) }, { merge:true });
    });
    if(meId === id){ meId = null; lsSet("me:"+tid, ""); }
    if(filter === id) filter = "all";
    toast("Removed — "+(gone ? esc(gone.name.split(" ")[0])+"'s" : "their")+" leaves are kept if you add them back");
  } catch(e){ toast("Removing people needs internet."); }
}

/* Put a removed person back with their original member id. */
async function restoreFormer(id){
  if(!iAmLead()){ toast("Only the team lead can do that"); return; }
  const f = formerMember(id);
  if(!f) return;
  if(roster().some(m => m.name.toLowerCase() === String(f.name).toLowerCase())){
    toast(esc(f.name)+" is already on this team"); return;
  }
  try {
    await runTransaction(db, async tx => {
      const ref = doc(db, "teams", tid);
      const snap = await tx.get(ref);
      if(!snap.exists()) throw new Error("gone");
      const d = snap.data() || {};
      const cur = Array.isArray(d.members) ? d.members : [];
      if(cur.some(m => m.id === id)) return;
      const former = Array.isArray(d.formerMembers) ? d.formerMembers : [];
      tx.set(ref, { members: cur.concat([{ id:f.id, name:f.name,
                      color:f.color || COLORS[cur.length % COLORS.length] }]),
                    formerMembers: former.filter(x => x.id !== id) }, { merge:true });
    });
    toast(esc(String(f.name).split(" ")[0])+" is back — with the leaves they had marked");
  } catch(e){ toast("Adding people back needs internet."); }
}

/* The only thing in the app that really deletes someone's leaves. */
async function purgeFormer(id){
  if(!iAmLead()){ toast("Only the team lead can do that"); return; }
  const f = formerMember(id);
  if(!f) return;
  try {
    const years = [];
    const ys = await getDocs(collection(db, "teams", tid, "years"));
    ys.forEach(x => years.push(x.id));
    for(const y of years)
      await setDoc(doc(db, "teams", tid, "years", y), { days: { [id]: deleteField() } }, { merge:true });
    await runTransaction(db, async tx => {
      const ref = doc(db, "teams", tid);
      const snap = await tx.get(ref);
      if(!snap.exists()) throw new Error("gone");
      const former = Array.isArray(snap.data().formerMembers) ? snap.data().formerMembers : [];
      tx.set(ref, { formerMembers: former.filter(x => x.id !== id) }, { merge:true });
    });
    for(const y of Object.keys(yearData)) if(yearData[y]) delete yearData[y][id];
    rebuild(); render();
    toast("Deleted "+esc(String(f.name).split(" ")[0])+"'s leaves for good");
  } catch(e){ toast("Couldn't delete — are you online?"); }
}

async function renameTeam(name){
  name = String(name||"").trim().replace(/\s+/g," ");
  if(!name){ toast("Give the team a name"); return; }
  if(name.length > 79){ toast("That name is too long"); return; }
  if(name === teamDoc.name) return;
  if(!iAmLead()){ toast("Only the team lead can rename the team"); return; }
  try {
    await setDoc(doc(db, "teams", tid), { name }, { merge:true });
    rememberTeam(tid, name);
    toast("Renamed to "+esc(name));
  } catch(e){ toast("Couldn't rename. Needs internet."); }
}

async function makeLead(id){
  const m = member(id);
  if(!m) return;
  if(!(await askConfirm({ title:"Make "+m.name+" the lead?",
        body:"You'll stay on "+teamDoc.name+", but adding and removing people moves to them.",
        ok:"Make "+m.name.split(" ")[0]+" the lead" }))) return;
  navBack();
  try {
    await setDoc(doc(db, "teams", tid), { leadId:id }, { merge:true });
    toast(m.name.split(" ")[0]+" is now the team lead");
    refreshSheet();
  } catch(e){ toast("Couldn't transfer. Needs internet."); }
}

/* Every team this phone has joined AND picked a name in. A person has a
   different member id in each team, so mirroring means writing the same dates
   under each of those ids. */
function myTargets(){
  const out = [], missing = [], seen = new Set();
  const mine = myIds();
  const left = loadLeft();
  // every team whose roster carries one of my ids — including teams a lead put
  // me on that I have never opened
  for(const t of allTeams){
    if(left.includes(t.id)) continue;
    const hit = (t.members || []).filter(m => mine.has(m.id));
    if(hit.length === 1){ seen.add(t.id); out.push({ tid:t.id, mid:hit[0].id, name:t.name }); }
  }
  // plus anything this phone joined the old way, and hasn't been matched above
  for(const t of known){
    if(seen.has(t.id)) continue;
    const mid = lsGet("me:"+t.id);
    if(mid){ seen.add(t.id); out.push({ tid:t.id, mid, name:t.name }); }
    else missing.push(t.name);
  }
  return { targets:out, missing };
}

/* My marked dates in one team, read straight from that team's year documents.
   Works for teams that aren't currently open. */
async function myDatesIn(targetTid, mid){
  const out = new Set();
  const snap = await getDocs(collection(db, "teams", targetTid, "years"));
  snap.forEach(d => {
    const days = ((d.data() || {}).days || {})[mid] || {};
    for(const k of Object.keys(days)) out.add(k);
  });
  return out;
}

/* Compare my dates across every team this phone is mapped to, against the team
   currently open. Mirroring only ever covered teams that were set up at the
   moment of marking, so these can legitimately drift apart. */
async function checkMismatch(){
  mismatchChecked = true;
  mismatch = null;
  if(!meId || !tid) return null;
  const { targets } = myTargets();
  if(targets.length < 2) return null;
  const today = todayKey();
  try {
    const mine = await myDatesIn(tid, meId);
    const rows = [];
    for(const t of targets){
      if(t.tid === tid) continue;
      const theirs = await myDatesIn(t.tid, t.mid);
      // only care about dates from today on — history is allowed to differ
      const missing = Array.from(mine).filter(k => k >= today && !theirs.has(k)).sort();
      const extra   = Array.from(theirs).filter(k => k >= today && !mine.has(k)).sort();
      if(missing.length || extra.length)
        rows.push({ tid:t.tid, name:t.name, mid:t.mid, missing, extra });
    }
    mismatch = rows.length ? { rows } : null;
  } catch(e){ mismatch = null; }
  return mismatch;
}

/* Make every mapped team match the team currently open. Predictable in the
   direction that matters: what you see is what everyone gets. */
async function syncMyLeaves(){
  if(!mismatch || !mismatch.rows.length) return;
  toast("Syncing your leaves…");
  let added = 0, removed = 0, failed = 0;
  for(const row of mismatch.rows){
    try {
      const byYear = {};
      for(const k of row.missing){
        const y = k.slice(0,4);
        if(!byYear[y]) byYear[y] = {};
        byYear[y][k] = "full";
      }
      for(const k of row.extra){
        const y = k.slice(0,4);
        if(!byYear[y]) byYear[y] = {};
        byYear[y][k] = deleteField();
      }
      for(const y of Object.keys(byYear))
        await setDoc(doc(db, "teams", row.tid, "years", y),
          { days: { [row.mid]: byYear[y] } }, { merge:true });
      added += row.missing.length; removed += row.extra.length;
    } catch(e){ failed++; }
  }
  mismatch = null;
  closeSheet();
  toast("Your teams now match"
        + (added ? " · "+added+" added" : "")
        + (removed ? " · "+removed+" removed" : "")
        + (failed ? " · "+failed+" failed" : ""));
  render();
}

/* Clear one person's leave on one date, in THIS team only.
   Deliberately NOT mirrored across teams: a lead is responsible for their own
   team and has no business editing that person's other teams — and no way to
   know what they are. */
async function clearFor(memberId, k){
  if(!iAmLead()){ toast("Only the team lead can do that"); return; }
  const mm = member(memberId);
  if(!mm) return;
  const y = k.slice(0,4);
  watchYear(y);
  try {
    await setDoc(doc(db, "teams", tid, "years", y),
      { days: { [memberId]: { [k]: deleteField() } } }, { merge:true });
    // optimistic, so the sheet updates even before the listener fires
    if(yearData[y] && yearData[y][memberId]) delete yearData[y][memberId][k];
    rebuild(); render(); refreshSheet();
    toast("Cleared "+esc(mm.name.split(" ")[0])+"'s leave");
  } catch(e){ toast("Couldn't clear it — are you online?"); }
}

/* Mark or unmark any number of dates, across every team at once. */
async function writeLeaves(keys, on){
  keys = keys.filter(k => k >= todayKey());
  if(!keys.length){ toast("Past dates can't be changed"); return; }
  if(!meId){ openWhoami(); return; }

  const { targets, missing } = myTargets();
  if(!targets.length){ openWhoami(); return; }

  // group by calendar year so each year document is written once
  const byYear = {};
  for(const k of keys){
    const y = k.slice(0,4);
    if(!byYear[y]) byYear[y] = [];
    byYear[y].push(k);
  }

  // optimistic update for the team on screen, so the tap feels instant
  for(const y of Object.keys(byYear)){
    watchYear(y);
    yearData[y] = yearData[y] || {};
    yearData[y][meId] = yearData[y][meId] || {};
    for(const k of byYear[y]){
      if(on) yearData[y][meId][k] = "full"; else delete yearData[y][meId][k];
    }
  }
  rebuild(); render();

  /* Every team's write is handed to the database at once. Waiting for each to
     reach the server before starting the next meant that, offline, only the
     first team's change was even queued — close the app and the rest were lost. */
  const writes = [];
  for(const tg of targets){
    for(const y of Object.keys(byYear)){
      const days = {};
      for(const k of byYear[y]) days[k] = on ? "full" : deleteField();
      writes.push(setDoc(doc(db, "teams", tg.tid, "years", y),
        { days: { [tg.mid]: days } }, { merge:true }));
    }
  }
  const n = keys.length;
  unsynced += n; updatePending(); renderStatus();
  const sent = Promise.all(writes);
  sent.then(() => {}, () => {}).then(() => { unsynced = Math.max(0, unsynced - n); updatePending(); render(); });

  const what = n === 1 ? "Leave" : n+" days";
  const where = targets.length > 1 ? " in all "+targets.length+" of your teams" : "";
  const slow = new Promise(r => setTimeout(() => r("slow"), 4000));
  const first = navigator.onLine ? await Promise.race([sent.then(() => "ok", () => "fail"), slow]) : "offline";
  if(first === "fail"){ toast("Couldn't save — check your connection"); return; }
  if(first === "ok") toast(what + (on ? " marked" : " removed") + where);
  else toast(what + (on ? " marked" : " removed") + " \u00B7 saved on this phone, will sync when you're online");
  if(missing.length)
    setTimeout(() => toast("Pick your name in "+esc(missing[0])+" to mirror leaves there"), 2700);
}

function download(name, text, mime){
  const blob = new Blob([text], { type:mime || "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* Turn one team's raw storage into something a person can actually read:
   dates grouped under each member's name rather than under an internal id. */
function shapeTeam(id, name, leadId, members, daysByMember){
  const byId = {};
  for(const m of members) byId[m.id] = m.name;
  const people = members.map(m => {
    const dates = Object.keys(daysByMember[m.id] || {}).sort();
    return { name:m.name, id:m.id, isLead:m.id === leadId, leaveCount:dates.length, dates };
  });
  return { teamId:id, team:name, lead:byId[leadId] || null, people };
}

/* Every team this phone has joined, in one file. Reads through the offline
   cache, so this works with no signal using the last data each team synced. */
async function exportAllTeams(){
  if(!known.length){ toast("No teams to export yet"); return; }
  toast("Preparing your backup…");
  const out = { exported:new Date().toISOString(), app:"Team Leaves", teams:[] };
  let failed = 0;
  for(const t of known){
    try {
      const tSnap = await getDoc(doc(db, "teams", t.id));
      if(!tSnap.exists()){ failed++; continue; }
      const d = tSnap.data() || {};
      const members = Array.isArray(d.members) ? d.members : [];
      const merged = {};
      const ySnap = await getDocs(collection(db, "teams", t.id, "years"));
      ySnap.forEach(yd => {
        const days = (yd.data() || {}).days || {};
        for(const mid of Object.keys(days))
          merged[mid] = Object.assign(merged[mid] || {}, days[mid] || {});
      });
      out.teams.push(shapeTeam(t.id, d.name || t.name, d.leadId, members, merged));
    } catch(e){ failed++; }
  }
  if(!out.teams.length){ toast("Couldn't read your teams. Try again online."); return; }
  download("team-leaves-all-"+todayKey()+".json", JSON.stringify(out, null, 2));
  const n = out.teams.length;
  toast("Backed up "+n+(n===1?" team":" teams")+(failed ? " · "+failed+" couldn't be read" : ""));
}

/* Accepts both files this app produces: the all-teams backup and the
   single-team one. Returns [{ name, people:[{id,name,dates:[]}] }]. */
function normaliseBackup(data){
  const teams = [];
  const pushAllTeams = t => {
    if(!t || !Array.isArray(t.people)) return;
    teams.push({
      teamId: t.teamId || null,
      name: String(t.team || "Untitled"),
      people: t.people.map(p => ({
        id: p.id || null,
        name: String(p.name || "").trim(),
        dates: Array.isArray(p.dates) ? p.dates.filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)) : []
      })).filter(p => p.name)
    });
  };
  if(data && Array.isArray(data.teams)){ data.teams.forEach(pushAllTeams); return teams; }
  // single-team format: members[] plus leaves keyed by member id
  if(data && Array.isArray(data.members)){
    const leaves = data.leaves || {};
    teams.push({
      teamId: data.teamId || null,
      name: String(data.team || "Untitled"),
      people: data.members.map(m => ({
        id: m.id || null,
        name: String(m.name || "").trim(),
        dates: Object.keys(leaves[m.id] || {}).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort()
      })).filter(p => p.name)
    });
  }
  return teams;
}

/* Work out, for each team in the backup, whether it can be restored here:
   matched by team id (survives renames), or by name for older backups. */
async function buildRestorePlan(teams){
  const plan = [];
  for(const src of teams){
    let hit = src.teamId ? known.find(k => k.id === src.teamId) : null;
    let how = hit ? "id" : null;
    if(!hit){
      hit = known.find(k => String(k.name).toLowerCase() === src.name.toLowerCase());
      if(hit) how = "name";
    }
    if(!hit){ plan.push({ src, tid:null, lead:false, how:null, reason:"not on this phone" }); continue; }
    let lead = false, reason = null;
    try {
      const snap = await getDoc(doc(db, "teams", hit.id));
      if(!snap.exists()) reason = "team no longer exists";
      else lead = (snap.data().leadId && snap.data().leadId === lsGet("me:"+hit.id));
      if(!reason && !lead) reason = "you're not the lead of this team";
    } catch(e){ reason = "couldn't be checked"; }
    plan.push({ src, tid:hit.id, teamName:hit.name, lead, how, reason });
  }
  return plan;
}

function pickRestoreFile(){
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "application/json,.json";
  inp.addEventListener("change", async () => {
    const f = inp.files && inp.files[0];
    if(!f) return;
    try {
      const teams = normaliseBackup(JSON.parse(await f.text()));
      if(!teams.length){ toast("No team data found in that file"); return; }
      toast("Checking the backup…");
      const plan = await buildRestorePlan(teams);
      pendingRestore = { teams, plan, fileName:f.name };
      navSheet({ type:"restore" });
    } catch(e){ toast("Couldn't read that file — is it a Team Leaves backup?"); }
  });
  inp.click();
}

/* Restore one backup entry into one team.
   mode "merge"   → add anything missing, touch nothing that already exists
   mode "replace" → that team's leaves become exactly what the backup says
   Neither mode ever removes a person from a roster. */
async function restoreInto(targetTid, src, mode){
  const snap = await getDoc(doc(db, "teams", targetTid));
  if(!snap.exists()) return { ok:false, reason:"team no longer exists", count:0 };
  const d = snap.data() || {};
  const cur = Array.isArray(d.members) ? d.members : [];

  if(!(d.leadId && d.leadId === lsGet("me:"+targetTid)))
    return { ok:false, reason:"not the lead", count:0 };

  const byId = {}, byName = {};
  for(const mm of cur){ byId[mm.id] = mm; byName[mm.name.toLowerCase()] = mm; }

  const added = [];
  const resolved = [];
  for(const p of src.people){
    let mm = (p.id && byId[p.id]) || byName[p.name.toLowerCase()];
    if(!mm){
      // re-added with the backup's own id, so their dates reattach exactly
      mm = { id:p.id || newMemberId(), name:p.name,
             color:COLORS[(cur.length + added.length) % COLORS.length] };
      added.push(mm); byId[mm.id] = mm; byName[mm.name.toLowerCase()] = mm;
    }
    resolved.push({ mid:mm.id, dates:p.dates });
  }

  const wanted = {};
  for(const r of resolved){
    for(const dt of r.dates){
      const y = dt.slice(0,4);
      if(!wanted[y]) wanted[y] = {};
      if(!wanted[y][r.mid]) wanted[y][r.mid] = {};
      wanted[y][r.mid][dt] = "full";
    }
  }

  if(added.length){
    await runTransaction(db, async tx => {
      const ref = doc(db, "teams", targetTid);
      const fresh = await tx.get(ref);
      const fd = fresh.exists() ? (fresh.data() || {}) : {};
      const existing = Array.isArray(fd.members) ? fd.members : [];
      const have = new Set(existing.map(x => x.id));
      const back = new Set(added.map(x => x.id));
      const former = Array.isArray(fd.formerMembers) ? fd.formerMembers : [];
      // anyone the backup puts back on the roster is no longer "removed"
      tx.set(ref, { members: existing.concat(added.filter(x => !have.has(x.id))),
                    formerMembers: former.filter(x => !back.has(x.id)) }, { merge:true });
    });
  }

  if(mode === "merge"){
    for(const y of Object.keys(wanted))
      await setDoc(doc(db, "teams", targetTid, "years", y), { days: wanted[y] }, { merge:true });
  } else {
    /* "Replace all" overwrites each year document outright. Dormant dates belong
       to removed people, who are never in a backup — carry them through, or a
       restore would silently do the deleting that removal deliberately doesn't. */
    const dormant = new Set((Array.isArray(d.formerMembers) ? d.formerMembers : []).map(x => x.id));
    const before = {};
    const ys = await getDocs(collection(db, "teams", targetTid, "years"));
    ys.forEach(x => { before[x.id] = (x.data() || {}).days || {}; });
    for(const y of Array.from(new Set(Object.keys(before).concat(Object.keys(wanted))))){
      const days = Object.assign({}, wanted[y] || {});
      const prev = before[y] || {};
      for(const mid of Object.keys(prev))
        if(dormant.has(mid) && !days[mid]) days[mid] = prev[mid];
      await setDoc(doc(db, "teams", targetTid, "years", y), { days });
    }
  }

  const count = resolved.reduce((n,r) => n + r.dates.length, 0);
  return { ok:true, count, addedPeople:added.length };
}

/* Restore every team in the file that this phone can write to. */
async function applyRestoreAll(mode){
  if(!pendingRestore) return;
  const doable = pendingRestore.plan.filter(x => x.tid && x.lead);
  if(!doable.length){ toast("Nothing in this file can be restored from this phone"); return; }
  toast("Restoring "+doable.length+(doable.length===1?" team…":" teams…"));
  let teamsDone = 0, dates = 0, people = 0, failed = 0;
  for(const item of doable){
    try {
      const r = await restoreInto(item.tid, item.src, mode);
      if(r.ok){ teamsDone++; dates += r.count; people += (r.addedPeople || 0); }
      else failed++;
    } catch(e){ failed++; }
  }
  pendingRestore = null;
  closeSheet();
  toast("Restored "+dates+" leave "+(dates===1?"day":"days")+" across "+teamsDone
        +(teamsDone===1?" team":" teams")
        +(people ? " · "+people+" re-added" : "")
        +(failed ? " · "+failed+" failed" : ""));
}

/* Restore a single entry into the team currently on screen. Useful when a
   team was recreated, or renamed so far it no longer matches. */
async function applyRestoreOne(index, mode, intoCurrent){
  if(!pendingRestore) return;
  const item = pendingRestore.plan[index];
  if(!item) return;
  const targetTid = intoCurrent ? tid : item.tid;
  if(!targetTid) return;
  toast("Restoring…");
  try {
    const r = await restoreInto(targetTid, item.src, mode);
    pendingRestore = null;
    closeSheet();
    toast(r.ok ? "Restored "+r.count+" leave "+(r.count===1?"day":"days")
               : "Couldn't restore — "+r.reason);
  } catch(e){ toast("Restore failed — are you online?"); }
}

/* ── Excel download ─────────────────────────────────────────────
   A real .xlsx built here, with no library: a handful of XML files in an
   uncompressed zip. Two sheets — every stretch of leave, and a per-person
   summary — with real date cells, so the file sorts and filters in Excel. */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){            // files: [{name, text}]  →  Uint8Array
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  const u16 = v => [v & 255, (v >>> 8) & 255];
  const u32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  for(const f of files){
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    const common = [...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21),
                    ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0)];
    const local = new Uint8Array([...u32(0x04034b50), ...common]);
    parts.push(local, name, data);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...common,
                 ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)]), name);
    offset += local.length + name.length + data.length;
  }
  const cdSize = central.reduce((n,p) => n + p.length, 0);
  const end = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length),
                ...u16(files.length), ...u32(cdSize), ...u32(offset), ...u16(0)]);
  const all = parts.concat(central, [end]);
  const out = new Uint8Array(all.reduce((n,p) => n + p.length, 0));
  let at = 0; for(const p of all){ out.set(p, at); at += p.length; }
  return out;
}
function xmlEsc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function excelDate(k){ const p = k.split("-"); return Date.UTC(+p[0], +p[1]-1, +p[2]) / 86400000 + 25569; }
function colName(i){ return String.fromCharCode(65 + i); }

/* rows: arrays of {v, s} where s is a style id from xlsxStyles() and a number
   v is written as a number (dates are numbers with a date style). */
function sheetXML(title, sub, head, rows, widths){
  const HEAD_ROW = 4, last = HEAD_ROW + rows.length, lastCol = colName(head.length - 1);
  const cell = (c, r, x) => typeof x.v === "number"
    ? `<c r="${c}${r}" s="${x.s}"><v>${x.v}</v></c>`
    : `<c r="${c}${r}" s="${x.s}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(x.v)}</t></is></c>`;
  let d = `<row r="1" ht="24" customHeight="1">${cell("A",1,{v:title,s:5})}</row>`
        + `<row r="2">${cell("A",2,{v:sub,s:6})}</row>`
        + `<row r="${HEAD_ROW}" ht="22" customHeight="1">${head.map((h,i) => cell(colName(i), HEAD_ROW, {v:h, s:1})).join("")}</row>`;
  rows.forEach((r, j) => {
    const n = HEAD_ROW + 1 + j;
    d += `<row r="${n}" ht="20" customHeight="1">${r.map((x,i) => cell(colName(i), n, x)).join("")}</row>`;
  });

/* Consecutive marked days grouped into one stretch: [{start, end, days}] */
function stretches(keys){
  const out = []; let cur = null;
  for(const k of keys.slice().sort()){
    if(cur && nextDayKey(cur.end) === k){ cur.end = k; cur.days++; continue; }
    cur = { start:k, end:k, days:1 }; out.push(cur);
  }
  return out;
}

/* Every person on the team now, with every date they have marked in any year. */
function excelWorkbook(teamName, people, byMember, today){
  const year = today.slice(0,4), d = parse(today);
  const when = d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear();
  const list = people.slice().sort((a,b) => String(a.name).localeCompare(String(b.name)));
  const leaveRows = [], sumRows = [];
  for(const m of list){
    const keys = Object.keys(byMember[m.id] || {}).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k));
    for(const s of stretches(keys))
      leaveRows.push([{v:m.name,s:4}, {v:excelDate(s.start),s:2}, {v:excelDate(s.end),s:2}, {v:s.days,s:3}]);
    const up = keys.filter(k => k >= today).sort();
    sumRows.push([{v:m.name,s:4}, {v:keys.filter(k => k.slice(0,4) === year).length,s:3},
                  {v:up.length,s:3}, up.length ? {v:excelDate(up[0]),s:2} : {v:"—",s:3}]);
  }
  const noLeaves = !leaveRows.length;
  if(noLeaves) leaveRows.push([{v:"No leaves marked yet",s:4}, {v:"",s:4}, {v:"",s:4}, {v:"",s:4}]);
  const L = leaveRows.length + 4, S = sumRows.length + 4;
  return buildXlsx([
    { name:"Leaves", filterRef: noLeaves ? null : "$A$4:$D$"+L,
      xml: sheetXML(teamName+" · leaves", "Downloaded "+when+" \u00B7 one row per stretch of leave \u00B7 Days = dates marked, weekends included",
                    ["Name","From","To","Days"], leaveRows, [26,19,19,9]) },
    { name:"Summary", filterRef: sumRows.length ? "$A$4:$D$"+S : null,
      xml: sheetXML(teamName+" · summary", "Downloaded "+when+" \u00B7 leave days = dates marked, weekends included",
                    ["Name","Leave days in "+year,"Upcoming leave days","Next leave"], sumRows, [26,19,22,19]) }
  ]);
}

async function exportExcel(){
  if(!teamDoc){ return; }
  toast("Preparing the Excel file…");
  try {
    const byMember = {};
    const ys = await getDocs(collection(db, "teams", tid, "years"));
    ys.forEach(yd => {
      const days = (yd.data() || {}).days || {};
      for(const mid of Object.keys(days)) byMember[mid] = Object.assign(byMember[mid] || {}, days[mid] || {});
    });
    const bytes = excelWorkbook(teamDoc.name, roster(), byMember, todayKey());
    const d = new Date();
    const file = "Team Leaves - "+String(teamDoc.name).replace(/[\\/:*?"<>|]+/g,"").trim()
               +" - "+d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear()+".xlsx";
    download(file, bytes, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
    toast("Excel file downloaded");
  } catch(e){ toast("Couldn't make the Excel file. Try again online."); }
}

async function copy(text, label){
  try { await navigator.clipboard.writeText(text); toast((label||"Copied")); }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(label||"Copied"); }
    catch(e2){ toast("Copy failed — select the text manually"); }
    document.body.removeChild(ta);
  }
}

/* Group a person's upcoming leaves into consecutive runs, then describe each
   one the way someone would say it out loud: "Thu 20 – Fri 21 Aug, 2 days". */
function upcomingList(id){
  const ks = upcoming(id), days = daysOf(id);
  const groups = []; let cur = null;
  for(const k of ks){
    const t = days[k];
    if(cur && cur.type === t && nextDayKey(cur.end) === k){ cur.end = k; continue; }
    cur = { start:k, end:k, type:t }; groups.push(cur);
  }
  const thisYear = new Date().getFullYear();
  const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return groups.map(g => {
    const a = parse(g.start), b = parse(g.end);
    const yr = d => d.getFullYear() === thisYear ? "" : " " + d.getFullYear();
    let label;
    if(g.start === g.end){
      label = WD[a.getDay()]+" "+a.getDate()+" "+MON[a.getMonth()]+yr(a);
    } else if(a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear()){
      label = WD[a.getDay()]+" "+a.getDate()+" – "+WD[b.getDay()]+" "+b.getDate()+" "+MON[b.getMonth()]+yr(b);
    } else {
      label = WD[a.getDay()]+" "+a.getDate()+" "+MON[a.getMonth()]+yr(a)
            +" – "+WD[b.getDay()]+" "+b.getDate()+" "+MON[b.getMonth()]+yr(b);
    }
    return { label, today: g.start === todayKey() };
  });
}

/* ═══════════════════════════════════════════════════════════
   Back navigation

   Every screen you can back out of — the team picker, Select-range mode and
   each sheet — is one entry on navStack and one browser history entry. Android's
   system Back and the back gesture pop the top screen instead of closing the
   whole app, which is what they did before this existed.

   The stack itself rides along in history.state, so a pop can never disagree
   with what's on screen: popstate takes the stack it is handed and redraws from
   it. Buttons never hide a sheet directly — they ask history to go back and let
   popstate do the work, so tapping Done and pressing Back run the same path.
   ═══════════════════════════════════════════════════════════ */
let navStack = [];      // [{screen:"pick"} | {screen:"range"} | {screen:"sheet", s:{type,…}}]

function sheetHTMLFor(x){
  if(x.type === "day")        return daySheetHTML(x.k);
  if(x.type === "manage")     return manageSheetHTML();
  if(x.type === "share")      return shareSheetHTML();
  if(x.type === "editmember") return editMemberSheetHTML(x.id);
  if(x.type === "restore")    return restoreSheetHTML();
  if(x.type === "drift")      return driftSheetHTML();
  if(x.type === "newteam")    return newTeamSheetHTML();
  if(x.type === "whoami")     return whoamiSheetHTML();
  if(x.type === "account")    return accountSheetHTML();
  if(x.type === "confirm")    return confirmSheetHTML();
  return "";
}

/* Draw whatever the stack says. Modes are "is it anywhere in the stack" so a
   sheet can sit on top of one; the sheet shown is the top entry, and only if
   the top entry is a sheet. */
function navApply(){
  const top = navStack.length ? navStack[navStack.length-1] : null;
  const wantPick  = navStack.some(x => x.screen === "pick");
  const wantRange = navStack.some(x => x.screen === "range");
  const wantSheet = (top && top.screen === "sheet") ? top.s : null;
  let redraw = false;
  // a confirmation that left the screen without its button being tapped is a no
  if(confirmAsk && !(wantSheet && wantSheet.type === "confirm")){
    const r = confirmAsk.resolve; confirmAsk = null;
    if(r) r(false);
  }

  if(wantPick && phase !== "pick"){
    stopAll(); tid = null; teamDoc = null; phase = "pick"; redraw = true;
  } else if(!wantPick && phase === "pick"){
    const back = lsGet("lastTeam");
    if(back && known.some(t => t.id === back)) openTeam(back);   // renders itself
  }
  if(rangeMode !== wantRange){
    rangeMode = wantRange; anchorKey = null; hoverKey = null; redraw = true;
  }
  if(redraw) render();

  if(wantSheet){
    openSheet_ = wantSheet;
    let html = "";
    try { html = sheetHTMLFor(wantSheet); } catch(e){ html = ""; }
    if(html) showSheet(html);        // else the next render draws it, once the team lands
  } else if(openSheet_) hideSheetNow();
}

function navPush(entry){
  navStack = navStack.concat([entry]);
  try { history.pushState({ tlStack:navStack }, ""); } catch(e){}
  navApply();
}
/* Swap the top screen without leaving a step to go back to — for a screen the
   user is finished with, like the new-team form once the team exists. */
function navReplace(entry){
  if(!navStack.length) return navPush(entry);
  navStack = navStack.slice(0,-1).concat([entry]);
  try { history.replaceState({ tlStack:navStack }, ""); } catch(e){}
  navApply();
}
function navSheet(x){ navPush({ screen:"sheet", s:x }); }
function navBack(){
  if(navStack.length){ try { history.back(); return; } catch(e){} }
  navApply();
}
/* Done / Close / finishing an action: drop every sheet, keep any mode under it.
   Hides first so nothing can redraw the sheet in the tick before popstate. */
function closeSheet(){
  let n = 0;
  for(let i = navStack.length-1; i >= 0 && navStack[i].screen === "sheet"; i--) n++;
  if(openSheet_) hideSheetNow();
  if(n){ try { history.go(-n); } catch(e){} }
}
/* Back out of everything — used when the ground moves, e.g. switching teams. */
function navReset(){
  if(openSheet_) hideSheetNow();
  if(navStack.length){ try { history.go(-navStack.length); } catch(e){} }
}

window.addEventListener("popstate", e => {
  navStack = (e.state && Array.isArray(e.state.tlStack)) ? e.state.tlStack : [];
  navApply();
});

$scrim.addEventListener("click", closeSheet);

function refreshSheet(){
  if(!openSheet_) return;
  const t = openSheet_.type;
  if(t === "day"){ showSheet(daySheetHTML(openSheet_.k)); return; }
  if(t === "share"){ showSheet(shareSheetHTML()); return; }
  if(t === "newteam" || t === "editmember" || t === "restore") return;   // never clobber a form or preview
  if(t === "drift"){ showSheet(driftSheetHTML()); return; }
  if(t === "manage"){
    const keep = {};
    for(const id of ["amName","tmRename"]){
      const el = document.getElementById(id);
      if(el) keep[id] = { v:el.value, focused:document.activeElement === el };
    }
    showSheet(manageSheetHTML());
    for(const id of Object.keys(keep)){
      const el = document.getElementById(id);
      if(el){ el.value = keep[id].v; if(keep[id].focused) el.focus(); }
    }
    const sug = document.getElementById("amSug");
    if(sug && keep.amName) sug.innerHTML = suggestHTML(keep.amName.v);
  }
}

    : `<p class="empty-out">Full team available.</p>`;

/* Matches against everyone on any roster in the app. Picking one of these adds
   THAT person — same member id — rather than a new someone with the same name. */
function suggestHTML(q){
  q = String(q||"").trim().toLowerCase();
  if(q.length < 2) return "";
  const here = new Set(roster().map(m => m.id));
  const hits = knownPeople()
    .filter(p => !here.has(p.id) && String(p.name).toLowerCase().includes(q))
    .sort((a,b) => String(a.name).localeCompare(String(b.name)))
    .slice(0, 6);
  if(!hits.length) return "";
  return `<div class="sug">${hits.map(p =>
    `<button class="sugrow" data-act="am-pick" data-id="${p.id}" data-name="${esc(p.name)}">
       <b>${esc(p.name)}</b><span>Already on ${esc(p.teams.join(" \u00B7 "))}</span></button>`).join("")}
    <p class="sugnote">Tap a name to add that same person: their upcoming leaves come
      across, and their phone picks up the new team on its own.</p></div>`;
}
