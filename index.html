function restoreSheetHTML(){
  if(!pendingRestore) return `<h3>Nothing to restore</h3>
    <div class="act"><button class="btn flat" data-act="back">Back</button></div>`;
  const { plan, fileName } = pendingRestore;
  const doable = plan.filter(x => x.tid && x.lead);
  const dates = doable.reduce((n,x) => n + x.src.people.reduce((a,p) => a + p.dates.length, 0), 0);

  let h = `<h3>Restore backup</h3>
    <div class="sub">${esc(fileName)} · ${plan.length} ${plan.length===1?"team":"teams"} in this file</div>
    <ul class="mlist">`;

  plan.forEach((x,i) => {
    const n = x.src.people.reduce((a,p) => a + p.dates.length, 0);
    const ready = x.tid && x.lead;
    h += `<li><div class="who"><b>${esc(x.src.name)}</b><span>${
      x.src.people.length} people · ${n} leave ${n===1?"day":"days"}${
      ready ? "" : " · " + esc(x.reason || "unavailable")}</span></div>`;
    if(ready) h += `<button class="pick" data-act="rs-one" data-i="${i}">Only this</button>`;
    else if(!x.tid && teamDoc) h += `<button class="pick" data-act="rs-into" data-i="${i}">Into ${esc(String(teamDoc.name).split(" ")[0])}</button>`;
    h += `</li>`;
  });
  h += `</ul>`;

  if(doable.length){
    h += `<p style="font-size:13.5px;color:var(--ink-2);margin:14px 0 4px">
      Ready to restore <b>${doable.length}</b> ${doable.length===1?"team":"teams"} · ${dates} leave ${dates===1?"day":"days"}.</p>`;
    const missing = [];
    for(const x of doable){
      for(const p of x.src.people){
        // flag anyone who'd be re-added, using the roster we can see
        if(x.tid === tid && !roster().some(m => m.id === p.id || m.name.toLowerCase() === p.name.toLowerCase()))
          missing.push(p.name);
      }
    }
    if(missing.length)
      h += `<p style="font-size:12.5px;color:var(--o-700);margin:0 0 4px">
        Will be added back to ${esc(teamDoc.name)}: ${esc(missing.join(", "))}</p>`;

    h += `<div class="act" style="margin-top:12px">
      <button class="btn primary" data-act="rs-all-merge">Add back anything missing${
        doable.length > 1 ? " · all "+doable.length+" teams" : ""}</button>
      <button class="btn danger" data-act="rs-all-replace">Replace all leaves${
        doable.length > 1 ? " in all "+doable.length+" teams" : ""}</button>
      <button class="btn flat" data-act="rs-cancel">Cancel</button></div>`;
  } else {
    h += `<p style="font-size:13.5px;color:var(--ink-2);margin:14px 0 4px">
      None of these can be restored from this phone. You can only restore a team you lead —
      ask that team's lead to run this, or use <b>Into ${esc(teamDoc ? String(teamDoc.name).split(" ")[0] : "this team")}</b>
      above to pull one entry into the team you're viewing.</p>
      <div class="act"><button class="btn flat" data-act="rs-cancel">Cancel</button></div>`;
  }

  h += `<p style="font-size:12px;color:var(--ink-3);margin:10px 0 0;line-height:1.6">
    <b>Add back</b> keeps every leave already marked and fills in what's missing — safe to run twice.
    <b>Replace</b> makes each team match the backup exactly, so leaves marked since the backup was
    taken are removed. Neither option removes anyone from a team.</p>`;
  return h;
}

  const fmt = k => { const d = parse(k);
    return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]; };
  let h = `<h3>Fix my leaves</h3>
    <div class="sub">Compared against ${esc(teamDoc.name)}</div>`;
  for(const r of mismatch.rows){
    h += `<div style="margin:0 0 14px">

    if(r.missing.length)
      h += `<div style="font-size:13px;color:var(--o-700);margin-top:3px">

      h += `<div style="font-size:13px;color:#9F1239;margin-top:3px">
        Will be removed: ${esc(r.extra.map(fmt).join(", "))}</div>`;

  h += `<p style="font-size:12.5px;color:var(--ink-3);margin:0 0 4px;line-height:1.6">

}

/* ── Confirmations ─────────────────────────────────────────────
   An in-app sheet in place of the browser's plain pop-up. Resolves true on the
   confirm button, false on Cancel, Back or tapping outside. On true the sheet
   is still showing: the caller moves on with navBack() (back to the sheet
   underneath) or closeSheet() (close everything). */
let confirmAsk = null;      // {title, body, ok, danger, resolve}
function askConfirm(o){
  return new Promise(resolve => {
    if(confirmAsk && confirmAsk.resolve) confirmAsk.resolve(false);
    confirmAsk = Object.assign({}, o, { resolve });
    navSheet({ type:"confirm" });
  });
}
function confirmSheetHTML(){
  if(!confirmAsk) return `<h3>Nothing to confirm</h3>
    <div class="act"><button class="btn flat" data-act="back">Back</button></div>`;
  const c = confirmAsk;
  return `<h3>${esc(c.title)}</h3>
    ${c.body ? `<p style="font-size:14px;color:var(--ink-2);margin:6px 0 18px;line-height:1.55">${esc(c.body)}</p>` : ""}
    <div class="act">
      <button class="btn ${c.danger ? "danger" : "primary"}" data-act="cf-ok">${esc(c.ok || "Confirm")}</button>
      <button class="btn flat" data-act="back">Cancel</button></div>`;
}

let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.innerHTML = msg; el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 2600);
}

/* ═══════════════════════════════════════════════════════════
   ⑨  Events
   ═══════════════════════════════════════════════════════════ */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.getAttribute("data-act");

  if(act === "view"){ view = el.getAttribute("data-v"); render(); return; }
  if(act === "filter"){ filter = el.getAttribute("data-id"); render(); return; }
  if(act === "team"){
    const id = el.getAttribute("data-id");
    if(id === tid && phase === "app") return;
    openTeam(id); navReset(); return;
  }
  if(act === "mo"){
    const d = +el.getAttribute("data-d");
    cursor = d === 0 ? startOfMonth(new Date()) : addMonths(cursor, d);
    render(); return;
  }

  if(act === "toggle"){
    const k = el.getAttribute("data-k");
    closeSheet();
    await writeLeaves([k], !(meId && daysOf(meId)[k]));
    return;
  }
  if(act === "range-on"){ navPush({ screen:"range" }); return; }
  if(act === "range-off"){ navBack(); return; }

  if(act === "manage"){ navSheet({ type:"manage" }); return; }
  if(act === "whoami"){ openWhoami(); return; }
  if(act === "pick"){ navPush({ screen:"pick" }); return; }
  if(act === "join"){ joinTeam(el.getAttribute("data-id")); navReset(); return; }
  if(act === "share"){ navSheet({ type:"share" }); return; }
  if(act === "newteam"){
    navSheet({ type:"newteam" });
    const i = document.getElementById("ntName"); if(i) i.focus(); return;
  }
  if(act === "nt-create"){
    const n = document.getElementById("ntName"), mm = document.getElementById("ntMe");
    const id = await createTeam(n ? n.value : "", mm ? mm.value : "");
    if(id) navReplace({ screen:"sheet", s:{ type:"share" } });   // the form is done with
    return;
  }
  if(act === "tm-rename"){
    const i = document.getElementById("tmRename");
    await renameTeam(i ? i.value : "");
    return;
  }
  if(act === "am-add"){
    const i = document.getElementById("amName");
    const added = await addMember(i ? i.value : "");
    if(added){
      if(i){ i.value = ""; i.focus(); }
      const box = document.getElementById("amSug"); if(box) box.innerHTML = "";
      toast(added.restored ? "Added back \u2014 with the leaves they had marked" : "Added");
      refreshSheet(); render();
    }
    return;
  }
  if(act === "am-pick"){
    const pid = el.getAttribute("data-id"), pname = el.getAttribute("data-name");
    const added = await addMember(pname, { id:pid });
    if(added){
      const i = document.getElementById("amName");
      if(i) i.value = "";
      const box = document.getElementById("amSug"); if(box) box.innerHTML = "";
      const first = String(pname).split(" ")[0];
      toast(added.copied
        ? esc(first)+" added \u00B7 "+added.copied+" upcoming "+(added.copied===1?"leave":"leaves")+" came across"
        : esc(first)+" added");
      refreshSheet(); render();
    }
    return;
  }
  if(act === "setme"){
    claimMeId(tid, el.getAttribute("data-id"));
    refreshSheet(); render();
    toast("Hi "+esc(me().name.split(" ")[0])+" — tap dates to mark your leave");
    // Newly identified in this team: your leaves elsewhere never reached it,
    // so check straight away rather than waiting for you to notice.
    if(myTargets().targets.length > 1){
      await checkMismatch();
      render();
      if(mismatch) navSheet({ type:"drift" });
    }
    return;
  }
  if(act === "editme"){
    if(!meId) return;
    navSheet({ type:"editmember", id:meId });
    const i = document.getElementById("emName");
    if(i){ i.focus(); i.select(); }
    return;
  }
  if(act === "editm"){
    const id = el.getAttribute("data-id");
    navSheet({ type:"editmember", id });
    const i = document.getElementById("emName");
    if(i){ i.focus(); i.select(); }
    return;
  }
  if(act === "em-save"){
    const i = document.getElementById("emName");
    const ok = await renameMember(el.getAttribute("data-id"), i ? i.value : "");
    if(ok){ navBack(); render(); }
    return;
  }
  if(act === "lead-clear"){
    const id = el.getAttribute("data-id"), k = el.getAttribute("data-k");
    const mm = member(id);
    if(!mm) return;
    if(!(await askConfirm({ title:"Clear "+mm.name.split(" ")[0]+"'s leave?",
          body:longDate(k)+". Only affects "+teamDoc.name+".", ok:"Clear this leave", danger:true }))) return;
    navBack();
    await clearFor(id, k);
    return;
  }
  if(act === "makelead"){ await makeLead(el.getAttribute("data-id")); return; }
  if(act === "rm"){
    const id = el.getAttribute("data-id"), m = member(id);
    if(!m) return;
    if(!(await askConfirm({ title:"Remove "+m.name+"?",
          body:"They come off "+teamDoc.name+"'s calendar, but their marked leaves are kept. Add them back later and the dates come back too.",
          ok:"Remove "+m.name.split(" ")[0], danger:true }))) return;
    navBack();
    await removeMember(id); refreshSheet(); render(); return;
  }
  if(act === "unrm"){
    await restoreFormer(el.getAttribute("data-id")); refreshSheet(); render(); return;
  }
  if(act === "purge"){
    const id = el.getAttribute("data-id"), f = formerMember(id);
    if(!f) return;
    if(!(await askConfirm({ title:"Delete "+f.name+"'s leaves for good?",
          body:"This can't be undone. If you add them back to "+teamDoc.name+" after this, they start with nothing.",
          ok:"Delete for good", danger:true }))) return;
    navBack();
    await purgeFormer(id); refreshSheet(); render(); return;
  }
  if(act === "copylink"){ await copy(appLink(), "Link copied"); return; }
  if(act === "copymsg"){
    const ta = document.getElementById("shareMsg");
    await copy(ta ? ta.value : appLink(), "Message copied — paste into WhatsApp");
    return;
  }
  if(act === "forget"){
    if(!(await askConfirm({ title:"Leave "+teamDoc.name+" on this phone?",
          body:"The team and its leaves stay for everyone else. You can rejoin any time from the team list.",
          ok:"Leave on this phone", danger:true }))) return;
    const gone = tid;
    forgetTeam(gone);
    closeSheet();
    if(known.length){ openTeam(known[0].id); }
    else { stopAll(); tid = null; teamDoc = null; phase = "pick"; render(); }
    return;
  }
  if(act === "export"){ exportJSON(); return; }
  if(act === "excel"){ await exportExcel(); return; }
  if(act === "export-all"){ await exportAllTeams(); return; }
  if(act === "drift"){ navSheet({ type:"drift" }); return; }
  if(act === "drift-sync"){ await syncMyLeaves(); return; }
  if(act === "recheck"){
    closeSheet();
    toast("Checking your teams…");
    await checkMismatch();
    render();
    if(mismatch) navSheet({ type:"drift" });
    else toast("Your teams already match");
    return;
  }
  if(act === "restore"){ pickRestoreFile(); return; }
  if(act === "rs-all-merge"){ await applyRestoreAll("merge"); return; }
  if(act === "rs-all-replace"){
    const n = pendingRestore ? pendingRestore.plan.filter(x => x.tid && x.lead).length : 0;
    if(!(await askConfirm({ title:"Replace all leaves in "+n+(n===1?" team":" teams")+"?",
          body:"Each team will match the backup exactly. Anything marked since the backup was taken will be removed.",
          ok:"Replace all leaves", danger:true }))) return;
    await applyRestoreAll("replace");
    return;
  }
  if(act === "rs-one"){ await applyRestoreOne(+el.getAttribute("data-i"), "merge", false); return; }
  if(act === "rs-into"){
    const i = +el.getAttribute("data-i");
    const nm = pendingRestore && pendingRestore.plan[i] ? pendingRestore.plan[i].src.name : "that team";
    if(!(await askConfirm({ title:"Add these leaves into "+teamDoc.name+"?",
          body:"Leaves from \u201C"+nm+"\u201D in the backup are added. Nothing already marked is removed.",
          ok:"Add them" }))) return;
    await applyRestoreOne(i, "merge", true);
    return;
  }
  if(act === "rs-cancel"){ pendingRestore = null; navBack(); return; }
  if(act === "cf-ok"){
    if(confirmAsk && confirmAsk.resolve){ const r = confirmAsk.resolve; confirmAsk.resolve = null; r(true); }
    return;
  }
  if(act === "close"){ closeSheet(); return; }
  if(act === "back"){ navBack(); return; }
});

/* ── Calendar gestures ─────────────────────────────────────────
   Normal mode:  tap = toggle that date.  Press and hold = who's out.
   Range mode:   press, drag, release = mark/unmark the whole run.
                 Or tap the first day and tap the last — no dragging needed.
   Range mode is a deliberate toggle rather than a hidden gesture, because a
   drag-anywhere calendar would swallow the vertical swipe used to scroll. */
(function calendarGestures(){
  let holdTimer = null, downKey = null, downXY = null, movedOff = false, handled = false;
  const HOLD_MS = 420, MOVE_TOL = 12;

  function cellAt(x,y){
    const el = document.elementFromPoint(x,y);
    const day = el && el.closest ? el.closest(".day") : null;
    return (day && !day.classList.contains("pad")) ? day.getAttribute("data-k") : null;
  }
  function paintPreview(){
    const grid = document.getElementById("calGrid");
    if(!grid) return;
    const lo = anchorKey && hoverKey ? (anchorKey < hoverKey ? anchorKey : hoverKey) : anchorKey;
    const hi = anchorKey && hoverKey ? (anchorKey < hoverKey ? hoverKey : anchorKey) : anchorKey;
    for(const c of grid.querySelectorAll(".day")){
      const k = c.getAttribute("data-k");
      const on = lo && k && k >= lo && k <= hi;
      c.classList.toggle("sel", !!on);
    }
  }
  function clearHold(){ if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; } }
  function reset(){ clearHold(); downKey = null; downXY = null; movedOff = false; dragging = false; }

  document.addEventListener("pointerdown", e => {
    if(phase !== "app" || view !== "calendar") return;
    const cell = e.target.closest ? e.target.closest(".day") : null;
    if(!cell || cell.classList.contains("pad")) return;
    const k = cell.getAttribute("data-k");
    if(!k) return;

    handled = false; movedOff = false;
    downKey = k; downXY = { x:e.clientX, y:e.clientY };

    if(rangeMode){
      dragging = true;
      if(!anchorKey){ anchorKey = k; hoverKey = k; }
      else { hoverKey = k; }
      paintPreview();
      return;
    }
    clearHold();
    holdTimer = setTimeout(() => {
      holdTimer = null; handled = true;
      navSheet({ type:"day", k });
    }, HOLD_MS);
  }, { passive:true });

  document.addEventListener("pointermove", e => {
    if(!downKey) return;
    if(rangeMode && dragging){
      const k = cellAt(e.clientX, e.clientY);
      if(k && k !== hoverKey){ hoverKey = k; paintPreview(); }
      return;
    }
    if(downXY && (Math.abs(e.clientX-downXY.x) > MOVE_TOL || Math.abs(e.clientY-downXY.y) > MOVE_TOL)){
      movedOff = true;      // they're scrolling, not tapping
      clearHold();
    }
  }, { passive:true });

  document.addEventListener("pointerup", async e => {
    if(!downKey) return;
    const startKey = downKey, wasHandled = handled, scrolled = movedOff;

    if(rangeMode && dragging){
      const endKey = cellAt(e.clientX, e.clientY) || hoverKey || startKey;
      reset();
      if(endKey === anchorKey && endKey === startKey){
        // a single tap in range mode: keep the anchor and wait for the second tap
        hoverKey = anchorKey;
        paintPreview();
        return;
      }
      const from = anchorKey || startKey;
      const keys = datesBetween(from, endKey);
      const on = !(meId && daysOf(meId)[from]);
      anchorKey = null; hoverKey = null;
      /* Removing several days at once gets a check: a drag that happened to
         start on an existing leave could otherwise wipe a whole stretch. */
      const losing = on ? [] : keys.filter(k => k >= todayKey() && meId && daysOf(meId)[k]);
      if(losing.length >= 2){
        paintPreview();
        const a = parse(losing[0]), b = parse(losing[losing.length-1]);
        const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
        const fmt = d => WD[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()];
        if(!(await askConfirm({ title:"Remove "+losing.length+" days of leave?",
              body:fmt(a)+" \u2013 "+fmt(b)+". Only the days you had marked are removed.",
              ok:"Remove "+losing.length+" days", danger:true }))) return;
        navBack();
      }
      await writeLeaves(keys, on);
      return;
    }

    reset();
    if(wasHandled || scrolled) return;
    if(startKey < todayKey()){
      if(iAmLead()) navSheet({ type:"day", k:startKey });
      else toast("Past dates are fixed — ask your team lead");
      return;
    }
    if(!meId){ openWhoami(); return; }
    await writeLeaves([startKey], !daysOf(meId)[startKey]);
  });

  document.addEventListener("pointercancel", () => { reset(); });
})();

document.addEventListener("input", e => {
  if(!e.target || e.target.id !== "amName") return;
  const box = document.getElementById("amSug");
  if(box) box.innerHTML = suggestHTML(e.target.value);
});

document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ navBack(); return; }
  if(e.key !== "Enter") return;
  const id = e.target && e.target.id;
  if(id === "amName") document.querySelector('[data-act="am-add"]')?.click();
  if(id === "tmRename") document.querySelector('[data-act="tm-rename"]')?.click();
  if(id === "emName") document.querySelector('[data-act="em-save"]')?.click();
  if(id === "ntMe")   document.querySelector('[data-act="nt-create"]')?.click();
});

document.getElementById("meBtn").addEventListener("click", () => {
  if(phase !== "app"){ return; }
  navSheet({ type:"account" });
});
window.addEventListener("online",  () => { net.online = true;  render(); });
window.addEventListener("offline", () => { net.online = false; render(); });

/* ═══════════════════════════════════════════════════════════
   ⑩  Boot
   ═══════════════════════════════════════════════════════════ */
loadKnown();
try { history.replaceState({ tlStack:[] }, ""); } catch(e){}
if(!CONFIGURED){
  phase = "pick"; render();
} else {
  render();
  onAuthStateChanged(auth, u => {
    if(!u) return;
    watchAllTeams();
    const last = lsGet("lastTeam");
    const start = (last && known.some(t => t.id === last)) ? last : (known[0] ? known[0].id : null);
    if(start) openTeam(start);
    else { phase = "pick"; render(); }
  });
  signInAnonymously(auth).catch(() => {
    phase = "pick";
    net.error = "auth";
    $body.innerHTML = `<div class="card gate"><h2>Sign-in is switched off</h2>
      <p>In the Firebase console go to <b>Authentication → Sign-in method</b> and enable
      <b>Anonymous</b>, then reload. Nobody has to type anything — this happens invisibly.</p></div>`;
    renderStatus();
  });
}

if("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persisted().then(a => a ? true : navigator.storage.persist()).catch(() => {});
}
